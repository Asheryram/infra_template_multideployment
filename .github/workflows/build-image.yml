# Reusable: build one service image and push it to GHCR.
# Called by app repos (see app-kit/.github/workflows/deploy.yml). Runs on GitHub-hosted runners.
name: build-image

on:
  workflow_call:
    inputs:
      service:
        description: service name from infra.yml (used for the cache scope)
        type: string
        required: true
      image:
        description: image repository from infra.yml, without a tag (e.g. ghcr.io/org/app-api)
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        description: Path from the repo root
        type: string
        default: Dockerfile
      tag:
        type: string
        required: true
      registry:
        type: string
        default: ghcr.io
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: ref
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: echo "image=${IMAGE,,}:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
          provenance: false
