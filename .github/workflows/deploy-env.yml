# Reusable: deploy one environment on the server. Runs ON the server via the
# self-hosted runner (label "infra"), so CI never needs SSH access.
name: deploy-env

on:
  workflow_call:
    inputs:
      env-name:
        description: prod | staging | develop | pr-<n>
        type: string
        required: true
      tag:
        type: string
        required: true
      branch:
        type: string
        default: ""
      github-environment:
        description: GitHub Environment to attach (protection rules, URL in the PR). Defaults to env-name.
        type: string
        default: ""
      runner-labels:
        type: string
        default: '["self-hosted", "infra"]'
    outputs:
      url:
        value: ${{ jobs.infradeploy.outputs.url }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    environment:
      name: ${{ inputs.github-environment || inputs.env-name }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: infra-${{ github.repository }}-${{ inputs.env-name }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .infradeploy

      - id: deploy
        env:
          ENV_NAME: ${{ inputs.env-name }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          infra deploy --manifest "$GITHUB_WORKSPACE/.infradeploy" \
            --env "$ENV_NAME" --tag "$TAG" --branch "$BRANCH" --commit "$COMMIT"

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const marker = '<!-- infra-preview -->';
            const { URL, TAG } = process.env;
            const lines = [
              marker,
              `### Preview ready`,
              `| | |`, `|---|---|`,
              `| App | ${URL} |`,
              `| Image tag | \`${TAG}\` |`,
              '', '_Updated on every push. Removed automatically when the PR closes._',
            ].filter(Boolean);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            const body = lines.join('\n');
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
