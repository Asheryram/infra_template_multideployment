# CI for this infra repo itself: shellcheck every script and validate compose files.
name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck --version
          find . -name '*.sh' -not -path './app-kit/*' -print0 | xargs -0 shellcheck -x -S warning
          shellcheck -x -S warning bin/infra
      - name: Validate app manifests
        run: bash local/test-manifest-parser.sh
      - name: Validate infra resource policy
        run: bash local/test-resource-limits.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform compose
        env:
          TRAEFIK_STATE_DIR: /tmp/traefik
          POSTGRES_PASSWORD: dummy
          DOMAIN: example.test
          COMPOSE_PROFILES: metrics,local-registry
        run: docker compose -f platform/docker-compose.yml config --quiet
      - name: Validate infra.yml examples
        run: |
          for f in app-kit/.infradeploy/infra.yml app-kit/examples/*.infra.yml; do
            python3 scripts/parse-manifest.py "$f" > /dev/null
          done
