name: platform container security

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/container-security.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/container-security.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
          - traefik:v3@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
          - postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
          - amir20/dozzle:latest@sha256:a7d69d20891d3dcc82636e24afa4c1c162b41d0673ef798b14f09e6b69accc5a
          - ghcr.io/goauthentik/server:2026.8.3
          - redis:7.4.2-alpine
          - prom/prometheus:v3.5.0
          - prom/node-exporter:v1.9.1
          - gcr.io/cadvisor/cadvisor:v0.55.1
          - grafana/grafana-oss:12.0.2
          - registry:2.8.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan platform image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Build and scan the console image
        if: matrix.image == 'registry:2.8.3'
        run: docker build --tag infra-console:ci platform/console
      - name: Scan console image for high and critical vulnerabilities
        if: matrix.image == 'registry:2.8.3'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: infra-console:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
