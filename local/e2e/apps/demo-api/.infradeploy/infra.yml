# demo-api — backend repo (its own GitHub repo in real life)
name: demo-api
services:
  api:
    image: local/demo-api
    port: 8080
    health_path: /health
    databases:
      - inject_as: DATABASE_URL
migrate:
  service: api
  cmd: python migrate.py
# A backend's previews stay reachable by the frontend preview (browsers can't do the SSO dance for XHR),
# so this API opts out of the gate; the frontend previews stay gated by default.
environments:
  preview:
    api:
      auth: false
