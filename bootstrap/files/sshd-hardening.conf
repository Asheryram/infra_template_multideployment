# Managed by infra bootstrap (bootstrap/files/sshd-hardening.conf). Do not edit on the server.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# "local" keeps `ssh -L` working (e.g. tunnelling to Grafana or Postgres)
AllowTcpForwarding local
ClientAliveInterval 300
ClientAliveCountMax 2
AllowUsers @ALLOW_USERS@
