# Component "api" — the backend (TYPE=backend, or the api half of TYPE=split).
services:
  api:
    image: ${API_IMAGE:?API_IMAGE not set}
    restart: unless-stopped
    init: true
    env_file: [runtime/api.env]
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach DBs/services published on the server itself
    networks: [default]          # this environment's private network only (see ensure_stack_network)
    mem_limit: ${API_MEM_LIMIT:?infra resource policy missing}
    cpus: ${API_CPUS:?infra resource policy missing}
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - infra.managed=true
      - infra.app=${APP}
      - infra.env=${ENV_NAME}
      - traefik.enable=true
      - traefik.docker.network=${STACK_NETWORK}
      - traefik.http.routers.${STACK}-api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.${STACK}-api.entrypoints=websecure
      - traefik.http.routers.${STACK}-api.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.${STACK}-api.middlewares=${API_MIDDLEWARES}
      - traefik.http.routers.${STACK}-api.service=${STACK}-api
      - traefik.http.services.${STACK}-api.loadbalancer.server.port=${API_PORT}

networks:
  # Created by infra deploy (not compose) so Traefik/Postgres can be attached per environment.
  default:
    name: ${STACK_NETWORK:?STACK_NETWORK not set}
    external: true
