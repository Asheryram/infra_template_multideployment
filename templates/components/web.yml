# Component "web" — the frontend (TYPE=frontend, or the web half of TYPE=split).
# No database network: frontends talk to the API over HTTPS like a browser would.
services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE not set}
    restart: unless-stopped
    init: true
    env_file: [runtime/web.env]
    networks: [default]          # this environment's private network only (see ensure_stack_network)
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.5}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - infra.managed=true
      - infra.app=${APP}
      - infra.env=${ENV_NAME}
      - traefik.enable=true
      - traefik.docker.network=${STACK_NETWORK}
      - traefik.http.routers.${STACK}-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.${STACK}-web.entrypoints=websecure
      - traefik.http.routers.${STACK}-web.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.${STACK}-web.middlewares=${WEB_MIDDLEWARES}
      - traefik.http.routers.${STACK}-web.service=${STACK}-web
      - traefik.http.services.${STACK}-web.loadbalancer.server.port=${WEB_PORT}

networks:
  # Created by infra deploy (not compose) so Traefik/Postgres can be attached per environment.
  default:
    name: ${STACK_NETWORK:?STACK_NETWORK not set}
    external: true
