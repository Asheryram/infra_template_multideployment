# Shared, always-on services. Managed with `infra platform up` — don't run compose by hand,
# platform.sh renders Traefik config and exports the variables used below.
#
#   always:   socket-proxy, traefik, postgres, uptime-kuma, dozzle
#   profiles: metrics        → prometheus, node-exporter, cadvisor, grafana   (~400 MB RAM)
#             local-registry → registry:2 on 127.0.0.1:5000 (local testing without GHCR)
#             authentik      → VPN-restricted identity provider for tenant console access
#             keycloak       → Keycloak identity server for tenant console access
#             keycloak-auth  → oauth2-proxy OIDC integration (enable after realm/client setup)
# Enable profiles with PLATFORM_PROFILES=metrics,local-registry,keycloak,keycloak-auth.
#
# Pin image versions (or digests) in the inventory once you're happy with them.
#
# Shared hosts: platform.sh refuses to start if a container/network name below or the
# Traefik ports already belong to someone else, and stamps every service with
# infra.managed=true (see $STATE_DIR/platform-managed.yml).
name: infra-platform

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # Traefik and Dozzle never touch the raw Docker socket: this proxy exposes read-only endpoints.
  socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    container_name: infra-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    mem_limit: 64m
    logging: *logging

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c}
    container_name: infra-traefik
    restart: unless-stopped
    depends_on: [socket-proxy]
    ports:
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ${TRAEFIK_STATE_DIR:?run via 'infra platform up'}:/etc/traefik:ro
      - traefik-acme:/acme
    env_file:
      - path: /etc/infra/traefik.env      # DNS provider token for Let's Encrypt
        required: false
    networks: [proxy, socket, metrics]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /etc/infra/platform.secrets.env}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - log_min_duration_statement=1000
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]                 # internal network: no ports published, no internet
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging: *logging

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83}
    container_name: infra-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks: [proxy]
    mem_limit: 256m
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.uptime.middlewares=${STATUS_MIDDLEWARES:-secure-headers@file}
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  # Web UI for container logs of every environment — give team leads the ops-auth login.
  dozzle:
    image: ${DOZZLE_IMAGE:-amir20/dozzle:latest@sha256:a7d69d20891d3dcc82636e24afa4c1c162b41d0673ef798b14f09e6b69accc5a}
    container_name: infra-dozzle
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: label=infra.managed=true     # only our containers, never other users' logs
    networks: [proxy, socket]
    mem_limit: 128m
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.dozzle.middlewares=${OPS_AUTH_MIDDLEWARE:-ops-auth@file},secure-headers@file
      - traefik.http.services.dozzle.loadbalancer.server.port=8080

  # DevOps console: environments, variables, wiring, actions, audit trail. Same scripts as the CLI.
  # It drives Docker (needs the real socket) — so it's ops-auth protected and audited.
  console:
    build: ./console
    image: infra-console:local
    container_name: infra-console
    restart: unless-stopped
    environment:
      INFRA_ROOT: ${INFRA_ROOT}
      INFRA_ENV_FILE: /etc/infra/infra.env
      INFRA_SECRETS_FILE: /etc/infra/platform.secrets.env
      RUN_UID: ${DEPLOY_UID:?run via 'infra platform up'}
      RUN_GID: ${DEPLOY_GID:?run via 'infra platform up'}
      DOCKER_SOCKET_GID: ${DOCKER_SOCKET_GID:?run via 'infra platform up'}
      INFRA_GITOPS_WEBHOOK_BASE: http://infra-console:8000
      CONSOLE_AUTH_MODE: ${CONSOLE_AUTH_MODE:-basic}
      # Invitations can create the invitee's Keycloak account (service-account client; empty secret = feature off)
      KEYCLOAK_ADMIN_URL: http://infra-keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-infra}
      KEYCLOAK_USER_ADMIN_CLIENT: ${KEYCLOAK_USER_ADMIN_CLIENT:-infra-user-admin}
      KEYCLOAK_USER_ADMIN_SECRET: ${KEYCLOAK_USER_ADMIN_SECRET:-}
      INVITE_CREATE_ACCOUNTS: ${INVITE_CREATE_ACCOUNTS:-true}
      AUTHENTIK_PLATFORM_ADMIN_GROUP: ${AUTHENTIK_PLATFORM_ADMIN_GROUP:-infra-platform-admins}
      KEYCLOAK_PLATFORM_ADMIN_GROUP: ${KEYCLOAK_PLATFORM_ADMIN_GROUP:-infra-platform-admins}
    volumes:
      # identical paths inside and out, so the scripts behave exactly as on the host
      - ${INFRA_ROOT}:${INFRA_ROOT}:ro
      - /etc/infra:/etc/infra:ro
      - ${SECRETS_ROOT}:${SECRETS_ROOT}
      - ${DEPLOY_ROOT}:${DEPLOY_ROOT}
      - ${BACKUP_DIR}:${BACKUP_DIR}
      - ${STATE_DIR}:${STATE_DIR}
      - ${LOG_DIR}:${LOG_DIR}
      - ${LOCK_DIR}:${LOCK_DIR}                 # shares deploy locks with CLI + CI runner
      # No raw Docker socket: the console drives Docker exclusively through the infra CLI
      # (bin/infra), which runs as the deploy user. This removes the console as a root-escalation
      # path. The socket-proxy is used by Traefik and Dozzle for read-only access only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [proxy]
    mem_limit: 256m
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.console.rule=Host(`console.${DOMAIN}`)
      - traefik.http.routers.console.entrypoints=websecure
      - traefik.http.routers.console.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.console.middlewares=${CONSOLE_AUTH_MIDDLEWARE:-ops-auth@file,secure-headers@file}
      - traefik.http.routers.console.service=${CONSOLE_ROUTER_SERVICE:-console}
      - traefik.http.routers.console-logout.rule=Host(`console.${DOMAIN}`) && Path(`/signed-out`)
      - traefik.http.routers.console-logout.priority=101
      - traefik.http.routers.console-logout.entrypoints=websecure
      - traefik.http.routers.console-logout.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.console-logout.middlewares=${CONSOLE_LOGOUT_MIDDLEWARE:-ops-auth@file,secure-headers@file}
      - traefik.http.routers.console-logout.service=console
      # Signed webhooks from registered projects: no ops login (the HMAC signature is the auth),
      # ONLY /webhook paths, rate limited. The console also refuses anything else on this host.
      - traefik.http.routers.hooks.rule=Host(`hooks.${DOMAIN}`) && PathPrefix(`/webhook`)
      - traefik.http.routers.hooks.entrypoints=websecure
      - traefik.http.routers.hooks.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.hooks.middlewares=hook-limit@file,secure-headers@file
      - traefik.http.routers.hooks.service=console
      - traefik.http.services.console.loadbalancer.server.port=8000

  # Optional self-hosted OIDC provider. Keep its host behind the VPN allow-list.
  authentik-redis:
    profiles: [authentik]
    image: ${AUTHENTIK_REDIS_IMAGE:-redis:7.4.2-alpine}
    container_name: infra-authentik-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    mem_limit: 192m
    logging: *logging

  authentik-server:
    profiles: [authentik]
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.8.3}
    container_name: infra-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in /etc/infra/platform.secrets.env}
      AUTHENTIK_POSTGRESQL__HOST: infra-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?set AUTHENTIK_POSTGRES_PASSWORD in /etc/infra/platform.secrets.env}
      AUTHENTIK_REDIS__HOST: infra-authentik-redis
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
    volumes:
      - authentik-media:/media
    networks: [proxy, data]
    depends_on:
      postgres: { condition: service_healthy }
      authentik-redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: ${AUTHENTIK_SERVER_MEM_LIMIT:-1536m}
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.authentik.middlewares=authentik-vpn@file,secure-headers@file
      - traefik.http.services.authentik.loadbalancer.server.port=9000

  authentik-worker:
    profiles: [authentik]
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.8.3}
    container_name: infra-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in /etc/infra/platform.secrets.env}
      AUTHENTIK_POSTGRESQL__HOST: infra-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?set AUTHENTIK_POSTGRES_PASSWORD in /etc/infra/platform.secrets.env}
      AUTHENTIK_REDIS__HOST: infra-authentik-redis
    volumes:
      - authentik-media:/media
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
      authentik-redis: { condition: service_started }
    mem_limit: ${AUTHENTIK_WORKER_MEM_LIMIT:-1024m}
    logging: *logging

  keycloak:
    profiles: [keycloak]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0}
    container_name: infra-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_DB: postgres
      KC_DB_URL_HOST: infra-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}
      KC_HTTPS_CERTIFICATE_FILE: /etc/keycloak-certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/keycloak-certs/tls.key
      KC_HTTPS_PORT: ${KEYCLOAK_HTTPS_PORT:-443}
    volumes:
      - ${TRAEFIK_STATE_DIR:?run via 'infra platform up'}/certs/keycloak:/etc/keycloak-certs:ro
    group_add:
      - "${DEPLOY_GID:?run via 'infra platform up'}"
    cap_add: [NET_BIND_SERVICE]
    networks:
      proxy:
        aliases:
          - auth.${DOMAIN}
      data: {}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1536m}
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.keycloak.middlewares=keycloak-vpn@file,secure-headers@file
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  oauth2-proxy:
    profiles: [keycloak-auth]
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.15.5}
    container_name: infra-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/realms/${KEYCLOAK_REALM:-infra}
      OAUTH2_PROXY_OIDC_USER_ID_CLAIM: sub
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-infra-console}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}:*
      OAUTH2_PROXY_REDIRECT_URL: https://console.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://console:8000/
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # No `groups` scope: the realm doesn't define one (Keycloak answers invalid_scope). The groups claim comes from the
      # client's group-membership mapper — see platform/keycloak/bootstrap-realm.sh.
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # A sign-in can legitimately take a while (a login tab left open, a password reset, a second factor). The default
      # one-time cookie lives 15 minutes, so finishing later ended on a 403 page until "Sign in" was pressed again.
      # Keep it as long as Keycloak accepts the login, and keep one per attempt so several open tabs don't overwrite each other.
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 1h
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      # Real sign-out. By default /oauth2/sign_out only clears this proxy's own cookie, so the Keycloak session stayed alive and
      # the next visit signed you straight back in without a password. With this URL oauth2-proxy also ends the Keycloak
      # session itself (server to server, using the session's own id_token), so "Sign out" means signed out everywhere.
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://auth.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/realms/${KEYCLOAK_REALM:-infra}/protocol/openid-connect/logout?id_token_hint={id_token}
      SSL_CERT_FILE: /etc/keycloak-certs/tls.crt
    volumes:
      - ${TRAEFIK_STATE_DIR:?run via 'infra platform up'}/certs/keycloak:/etc/keycloak-certs:ro
    group_add:
      - "${DEPLOY_GID:?run via 'infra platform up'}"
    networks: [proxy]
    depends_on:
      keycloak: { condition: service_started }
    mem_limit: ${OAUTH2_PROXY_MEM_LIMIT:-128m}
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth2-proxy.rule=Host(`console.${DOMAIN}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2-proxy.priority=100
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.oauth2-proxy.middlewares=secure-headers@file
      - traefik.http.routers.oauth2-proxy.service=oauth2-proxy
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180

  # Keycloak login for PREVIEW environments (PREVIEW_AUTH_MODE=keycloak). Separate from the console's proxy:
  # its own client, a cookie shared by every *.${DOMAIN} host, and one fixed callback host (sso.${DOMAIN}) because
  # Keycloak cannot register wildcard hosts. The console decides who may see which preview (project roles).
  oauth2-previews:
    profiles: [keycloak-previews]
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.15.5}
    container_name: infra-oauth2-previews
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/realms/${KEYCLOAK_REALM:-infra}
      OAUTH2_PROXY_OIDC_USER_ID_CLAIM: sub
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PREVIEWS_CLIENT_ID:-infra-previews}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PREVIEWS_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PREVIEWS_COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_NAME: _infra_preview
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}:*
      OAUTH2_PROXY_REDIRECT_URL: https://sso.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # No `groups` scope: the realm doesn't define one. The groups claim comes from the client's group-membership mapper.
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # A sign-in can legitimately take a while (a login tab left open, a password reset, a second factor). The default
      # one-time cookie lives 15 minutes, so finishing later ended on a 403 page until "Sign in" was pressed again.
      # Keep it as long as Keycloak accepts the login, and keep one per attempt so several open tabs don't overwrite each other.
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 1h
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      # Real sign-out. By default /oauth2/sign_out only clears this proxy's own cookie, so the Keycloak session stayed alive and
      # the next visit signed you straight back in without a password. With this URL oauth2-proxy also ends the Keycloak
      # session itself (server to server, using the session's own id_token), so "Sign out" means signed out everywhere.
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://auth.${DOMAIN}${PUBLIC_HTTPS_PORT_SUFFIX:-}/realms/${KEYCLOAK_REALM:-infra}/protocol/openid-connect/logout?id_token_hint={id_token}
      SSL_CERT_FILE: /etc/keycloak-certs/tls.crt
    volumes:
      - ${TRAEFIK_STATE_DIR:?run via 'infra platform up'}/certs/keycloak:/etc/keycloak-certs:ro
    group_add:
      - "${DEPLOY_GID:?run via 'infra platform up'}"
    networks: [proxy]
    depends_on:
      keycloak: { condition: service_started }
    mem_limit: ${OAUTH2_PROXY_MEM_LIMIT:-128m}
    logging: *logging
    labels:
      - traefik.enable=true
      # Only the login callback/start/sign-out endpoints are public on sso.<domain>, and only to the VPN like Keycloak itself.
      - traefik.http.routers.oauth2-previews.rule=Host(`sso.${DOMAIN}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2-previews.entrypoints=websecure
      - traefik.http.routers.oauth2-previews.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.oauth2-previews.middlewares=keycloak-vpn@file,secure-headers@file
      - traefik.http.routers.oauth2-previews.service=oauth2-previews
      - traefik.http.services.oauth2-previews.loadbalancer.server.port=4180

  # --------------------------------------------------------------- profile: metrics
  prometheus:
    profiles: [metrics]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    container_name: infra-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [metrics]
    mem_limit: 512m
    logging: *logging

  node-exporter:
    profiles: [metrics]
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    container_name: infra-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      # rslave lets it see submounts; hosts whose root is not a shared mount (WSL) set NODE_EXPORTER_ROOT_MODE=ro
      - /:/host:${NODE_EXPORTER_ROOT_MODE:-ro,rslave}
    networks: [metrics]
    mem_limit: 64m
    logging: *logging

  cadvisor:
    profiles: [metrics]
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.55.1}
    container_name: infra-cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=false",
              "--whitelisted_container_labels=infra.app,infra.env,com.docker.compose.project"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices: ["/dev/kmsg"]
    privileged: true
    networks: [metrics]
    mem_limit: 256m
    logging: *logging

  grafana:
    profiles: [metrics]
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:12.0.2}
    container_name: infra-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      # Alert emails (Gmail app password lives in platform.secrets.env, never in the repo)
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Infra alerts}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-root@localhost}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana-alerting:/etc/grafana/provisioning/alerting:ro
    networks: [proxy, metrics]
    mem_limit: 256m
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=${ROUTER_TLS:-true}
      - traefik.http.routers.grafana.middlewares=${STATUS_MIDDLEWARES:-secure-headers@file}
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  # --------------------------------------------------------------- profile: local-registry
  registry:
    profiles: [local-registry]
    image: registry:2.8.3
    container_name: infra-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"        # loopback only — Docker would bypass ufw otherwise
    volumes:
      - registry-data:/var/lib/registry
    mem_limit: 128m
    logging: *logging

networks:
  proxy:   { name: infra_proxy }
  data:    { name: infra_data, internal: true }
  socket:  { name: infra_socket, internal: true }
  metrics: { name: infra_metrics, internal: true }

volumes:
  traefik-acme:
  postgres-data:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:
  registry-data:
  authentik-media:
