# Critical: tell me right away, and remind me every 2 hours until it is fixed.
# Warning:  batch for a few minutes so related symptoms arrive as ONE mail, and remind me only twice a day.
apiVersion: 1
policies:
  - orgId: 1
    receiver: email-ops
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 15m
    repeat_interval: 12h
    routes:
      - receiver: email-ops
        object_matchers:
          - ["severity", "=", "critical"]
        group_by: ["alertname"]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 2h
