# Generated by the alert design in docs (rules per severity). Every query returns a series ONLY while its problem exists, so 'no data' is healthy.
# critical = act now (users affected / outage imminent); warning = act soon, batched. Previews are never alerted on.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: "platform-down"
  - orgId: 1
    uid: "traefik-5xx"
groups:
  - orgId: 1
    name: "infra"
    folder: "Infra"
    interval: "1m"
    rules:
      - uid: "disk-85"
        title: "Disk above 85%"
        condition: "C"
        for: "10m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Disk above 85%"
          description: "A disk is filling up. Postgres and every container stop when it is full."
          action: "Free space: docker image prune -a, old dumps in /var/lib/infra/db-backups, large logs. Then consider a bigger disk."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((1 - max by (device)(node_filesystem_avail_bytes{fstype=~\"ext4|xfs|btrfs\"}) / max by (device)(node_filesystem_size_bytes{fstype=~\"ext4|xfs|btrfs\"})) * 100 > 85 and (1 - max by (device)(node_filesystem_avail_bytes{fstype=~\"ext4|xfs|btrfs\"}) / max by (device)(node_filesystem_size_bytes{fstype=~\"ext4|xfs|btrfs\"})) * 100 <= 95) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "disk-95"
        title: "Disk above 95% (critical)"
        condition: "C"
        for: "2m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "Disk above 95% (critical)"
          description: "A disk is nearly full. Databases and apps are about to stop."
          action: "Free space NOW (docker image prune -a, delete old dumps). Check: df -h; docker system df."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((1 - max by (device)(node_filesystem_avail_bytes{fstype=~\"ext4|xfs|btrfs\"}) / max by (device)(node_filesystem_size_bytes{fstype=~\"ext4|xfs|btrfs\"})) * 100 > 95) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "disk-fills-24h"
        title: "Disk will be full within 24 hours"
        condition: "C"
        for: "30m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Disk will be full within 24 hours"
          description: "At the current growth a disk runs out of space within a day, before it reaches the 85% alert."
          action: "Find what grew: docker system df; du -xh /var/lib --max-depth=2. Prune or enlarge the disk today."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(predict_linear(max by (device)(node_filesystem_avail_bytes{fstype=~\"ext4|xfs|btrfs\"})[6h:5m], 24*3600) < 0 and (1 - max by (device)(node_filesystem_avail_bytes{fstype=~\"ext4|xfs|btrfs\"}) / max by (device)(node_filesystem_size_bytes{fstype=~\"ext4|xfs|btrfs\"})) * 100 > 50) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "memory-90"
        title: "Server memory above 90%"
        condition: "C"
        for: "15m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Server memory above 90%"
          description: "The server has been short of memory for 15 minutes. The kernel will start killing containers."
          action: "Find the hog: docker stats --no-stream. Lower an environment's memory limit, stop idle previews, or add RAM."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "cpu-90"
        title: "Server CPU above 90%"
        condition: "C"
        for: "30m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Server CPU above 90%"
          description: "The server has been CPU-bound for 30 minutes, so everything on it is slow."
          action: "Find the hog: docker stats --no-stream, or check for a stuck build. Consider more CPU or fewer previews."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100 > 90) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "errors-prod"
        title: "Users are getting server errors (prod/staging)"
        condition: "C"
        for: "5m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "Users are getting server errors (prod/staging)"
          description: "More than 5% of requests to one service fail with a 5xx. Real users are affected."
          action: "Read that service's logs (console, or Dozzle). If it began with a deploy, roll back: infra rollback <app> <env>."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-(prod|staging)-.+@docker\",code=~\"5..\"}[5m])) / sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-(prod|staging)-.+@docker\"}[5m]))) > 0.05 and sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-(prod|staging)-.+@docker\"}[5m])) > 0.05) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "errors-develop"
        title: "develop is returning server errors"
        condition: "C"
        for: "10m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "develop is returning server errors"
          description: "More than 5% of requests to one service fail with a 5xx. Only developers are affected."
          action: "Read that service's logs. Likely the last push; fix or roll back at your convenience."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-develop-.+@docker\",code=~\"5..\"}[5m])) / sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-develop-.+@docker\"}[5m]))) > 0.05 and sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-develop-.+@docker\"}[5m])) > 0.05) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "slow-prod"
        title: "Slow responses (prod/staging)"
        condition: "C"
        for: "10m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Slow responses (prod/staging)"
          description: "The slowest 5% of requests to one service take over 2 seconds."
          action: "Check the API logs and database load (slow queries, connection limit). Look at CPU/memory alerts at the same time."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(histogram_quantile(0.95, sum by (le, service)(rate(traefik_service_request_duration_seconds_bucket{service=~\"infra-.+-(prod|staging)-.+@docker\"}[5m]))) > 2 and sum by (service)(rate(traefik_service_requests_total{service=~\"infra-.+-(prod|staging)-.+@docker\"}[5m])) > 0.05) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "cert-14d"
        title: "TLS certificate expires within 14 days"
        condition: "C"
        for: "1h"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "TLS certificate expires within 14 days"
          description: "A certificate expires soon. Automatic renewal should have happened by now, so it is failing."
          action: "Check Traefik logs for ACME errors (DNS/port 80/rate limits). For a manual certificate: infra platform cert import."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((traefik_tls_certs_not_after - time()) / 86400 < 14 and (traefik_tls_certs_not_after - time()) / 86400 >= 3) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "cert-3d"
        title: "TLS certificate expires within 3 days (critical)"
        condition: "C"
        for: "10m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "TLS certificate expires within 3 days (critical)"
          description: "A certificate expires in under 3 days. Browsers will then block every site on this server."
          action: "Renew it now: check Traefik logs for ACME errors, or import a new certificate (infra platform cert import)."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "((traefik_tls_certs_not_after - time()) / 86400 < 3) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "scrape-down"
        title: "Monitoring cannot reach a target"
        condition: "C"
        for: "1m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "Monitoring cannot reach a target"
          description: "Prometheus cannot reach one of its targets, so alerts that depend on it are blind."
          action: "Check that its container is running: docker ps | grep infra-. Restart it: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(up == 0) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "all-targets-down"
        title: "Monitoring cannot reach ANY target"
        condition: "C"
        for: "1m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "Monitoring cannot reach ANY target"
          description: "Prometheus is running but every target (host, containers, Traefik) is unreachable, so no other alert can be trusted right now."
          action: "Check the monitoring network and containers: docker ps | grep -E 'infra-(node|cadvisor|prometheus)'. Restart: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(sum(up) == 0) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "prometheus-unreachable"
        title: "Prometheus is unreachable (monitoring is blind)"
        condition: "C"
        for: "1m"
        noDataState: "OK"
        execErrState: "Alerting"
        labels:
          severity: "critical"
        annotations:
          summary: "Prometheus is unreachable (monitoring is blind)"
          description: "Grafana cannot query Prometheus at all. Every metric-based alert is silent until it is back."
          action: "docker ps -a | grep infra-prometheus; docker logs infra-prometheus --tail 50. Restart: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "vector(1)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [1]
              refId: "C"
      - uid: "down-postgres"
        title: "Postgres is not running"
        condition: "C"
        for: "2m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "Postgres is not running"
          description: "Postgres is down. Every database-backed environment is failing."
          action: "docker ps -a | grep infra-postgres; docker logs infra-postgres --tail 50. Restart: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(absent(container_last_seen{name=\"infra-postgres\"}) and on() (count(container_last_seen{name!=\"\"}) > 0)) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "down-traefik"
        title: "Traefik is not running"
        condition: "C"
        for: "2m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "Traefik is not running"
          description: "Traefik is down. Nothing on this server is reachable."
          action: "docker ps -a | grep infra-traefik; docker logs infra-traefik --tail 50. Restart: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(absent(container_last_seen{name=\"infra-traefik\"}) and on() (count(container_last_seen{name!=\"\"}) > 0)) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "down-console"
        title: "The console is not running"
        condition: "C"
        for: "2m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "The console is not running"
          description: "The console is down. Deploys, webhooks and the admin UI are unavailable."
          action: "docker ps -a | grep infra-console; docker logs infra-console --tail 50. Restart: infra platform up."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(absent(container_last_seen{name=\"infra-console\"}) and on() (count(container_last_seen{name!=\"\"}) > 0)) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "crash-loop"
        title: "A prod/staging container keeps restarting"
        condition: "C"
        for: "0m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "critical"
        annotations:
          summary: "A prod/staging container keeps restarting"
          description: "A container restarted 3 or more times in 15 minutes. It is crash-looping, so that service is unreliable or down."
          action: "Read its logs for the crash reason. If it began with a deploy: infra rollback <app> <env>."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "(changes(container_start_time_seconds{name=~\"infra-.+-(prod|staging)-.+\"}[15m]) >= 3 and on() (count(container_last_seen{name!=\"\"}) > 0)) * 0 + 1"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params: [0]
              refId: "C"
      - uid: "container-memory"
        title: "A prod/staging container is near its memory limit"
        condition: "C"
        for: "15m"
        noDataState: "OK"
        execErrState: "OK"
        labels:
          severity: "warning"
        annotations:
          summary: "A prod/staging container is near its memory limit"
          description: "A container uses over 90% of its memory limit and will be killed (OOM) if it grows."
          action: "Raise its memory limit in the console, or find the leak (logs before each restart)."
        data:
          - refId: "A"
