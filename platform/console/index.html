<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infra Console</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  color-scheme: light;
  --bg: #f5f4f1;
  --panel: #ffffff;
  --panel-2: #faf9f7;
  --text: #17181c;
  --muted: #6c7078;
  --faint: #9a9da4;
  --line: #e8e5df;
  --line-strong: #d6d2ca;
  --ink: #17181c;          /* primary action */
  --on-ink: #ffffff;
  --accent: #2f5bea;       /* links, focus */
  --accent-soft: #eef2ff;
  --ok: #1d9a55;   --ok-soft: #e6f6ec;
  --warn: #b97709; --warn-soft: #fdf3dc;
  --bad: #d13b3b;  --bad-soft: #fdeaea;
  --prod: #b4232a;    --prod-soft: #fbe9ea;
  --staging: #a15c07; --staging-soft: #fdf0dc;
  --develop: #1f5fd1; --develop-soft: #e8f0fd;
  --preview: #6a46c9; --preview-soft: #f0eafc;
  --sidebar: #ffffff;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(23,24,28,.04);
  --shadow-lg: 0 24px 60px -12px rgba(23,24,28,.28);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0e11; --panel: #15171b; --panel-2: #1a1c21; --text: #ecebe8; --muted: #9a9ea6; --faint: #6c7078;
    --line: #25272d; --line-strong: #34373e; --ink: #f1f0ed; --on-ink: #111214;
    --accent: #7c9bff; --accent-soft: #1b2340;
    --ok: #3fcf84; --ok-soft: #102a1c; --warn: #f0b34a; --warn-soft: #2c2210; --bad: #ff6b6b; --bad-soft: #301616;
    --prod: #ff7b80; --prod-soft: #331618; --staging: #f0b34a; --staging-soft: #2c2210;
    --develop: #7fb0ff; --develop-soft: #14233d; --preview: #b79bff; --preview-soft: #241c3d;
    --sidebar: #111316; --shadow: none; --shadow-lg: 0 24px 60px -12px rgba(0,0,0,.7);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; min-height: 100vh; font-feature-settings: "tnum", "cv11"; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ── Shell ── */
#sidebar { width: 236px; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  position: fixed; inset: 0 auto 0 0; z-index: 20; }
#sidebar .brand { display: flex; align-items: center; gap: 11px; padding: 18px 18px 14px; }
#sidebar .brand svg { flex-shrink: 0; border-radius: 8px; }
#sidebar .brand-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.015em; }
#sidebar .brand-sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
#sidebar nav { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
#sidebar nav button { width: 100%; text-align: left; border: 0; background: none; color: var(--muted); padding: 8px 10px;
  border-radius: var(--radius-sm); font: inherit; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: background .12s, color .12s; }
#sidebar nav button:hover { background: var(--panel-2); color: var(--text); }
#sidebar nav button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--ink); }
#sidebar nav button svg { flex-shrink: 0; opacity: .8; }
#sidebar .sidebar-footer { padding: 14px 18px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
#sidebar .sidebar-footer a { color: var(--muted); }
#sidebar .sidebar-footer a:hover { color: var(--text); text-decoration: none; }
#sidebarUser { margin-bottom: 8px; font-weight: 550; color: var(--text); }
#sidebarLinks { display: flex; flex-direction: column; gap: 4px; }

#main { margin-left: 236px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
#topbar { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 0 28px; height: 60px;
  display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }
#menuBtn { display: none; }
#topbar h1 { font-size: 17px; font-weight: 650; letter-spacing: -.02em; }
#topbar .meta { color: var(--muted); font-size: 12.5px; font-family: var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
#topbar .links { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
#topbar .links a { font-size: 12.5px; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 6px; background: var(--panel); transition: border-color .12s, color .12s; }
#topbar .links a:hover { border-color: var(--line-strong); color: var(--text); text-decoration: none; }
#content { padding: 26px 28px 60px; max-width: 1360px; width: 100%; }

/* ── Cards / tables (used by the other tabs) ── */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-header h2 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.card-header .card-meta { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 10px 16px;
  border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; background: var(--panel-2); }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td, table tr:hover td { background: var(--panel-2); }
.empty { padding: 40px 24px; color: var(--muted); text-align: center; font-size: 13.5px; }

/* ── Pills, dots, chips ── */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.env-prod    { background: var(--prod-soft); color: var(--prod); border-color: transparent; }
.env-staging { background: var(--staging-soft); color: var(--staging); border-color: transparent; }
.env-develop { background: var(--develop-soft); color: var(--develop); border-color: transparent; }
.env-preview { background: var(--preview-soft); color: var(--preview); border-color: transparent; }
.badge-type { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; position: relative; }
.up { background: var(--ok); } .down { background: var(--bad); } .blocked { background: var(--warn); }
.up::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--ok); opacity: .22; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600;
  background: var(--warn-soft); color: var(--warn); margin-left: 6px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.quiet { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

/* ── Buttons, inputs ── */
button.btn { border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); padding: 6px 13px; border-radius: var(--radius-sm);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
button.btn:hover { background: var(--panel-2); border-color: var(--faint); }
button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
button.primary:hover { background: var(--ink); opacity: .86; border-color: var(--ink); }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
button.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { background: var(--panel-2); color: var(--text); border-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--text); transition: border-color .12s, box-shadow .12s; }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
input::placeholder { color: var(--faint); }

.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 10px 0; }
.resource-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; background: var(--panel-2); }
.resource-card h4 { font-size: 13px; text-transform: capitalize; margin-bottom: 8px; }
.resource-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.resource-fields label { display: grid; gap: 4px; color: var(--muted); font-size: 11.5px; }
.resource-fields input { width: 100%; font-family: var(--mono); }
.resource-effective { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
pre { background: #0c0d10; color: #d6d9de; padding: 14px 16px; border-radius: var(--radius-sm); overflow: auto; max-height: 440px;
  font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
.banner { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); color: var(--text);
  padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.55; }
.banner b { color: var(--warn); }

/* ── Environments view ── */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { position: relative; flex: 1 1 240px; max-width: 360px; }
.toolbar .search input { width: 100%; padding-left: 32px; }
.toolbar .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; font: inherit; font-size: 12.5px; padding: 4px 11px; border-radius: 4px; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--ink); color: var(--on-ink); }
.toolbar .summary { margin-left: auto; color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
.toolbar .summary b { color: var(--text); font-weight: 650; }

.attention { border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--panel); border-radius: var(--radius);
  margin-bottom: 18px; overflow: hidden; }
.attention-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--warn-soft); font-size: 12.5px; font-weight: 650; }
.attention-item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; }
.attention-item:hover { background: var(--panel-2); }
.attention-item .why { color: var(--muted); font-size: 12.5px; }
.attention-item .go { color: var(--muted); font-size: 12px; }

.app { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; box-shadow: var(--shadow); }
.app-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.app-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
.app-head .svc { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.svc-tag { font: 11.5px var(--mono); padding: 1px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.app-head .health { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.app-head .count { color: var(--muted); font-size: 12.5px; margin-left: 8px; }

.env-grid { display: grid; grid-template-columns: 16px 118px minmax(220px, 1.6fr) minmax(150px, 1fr) 124px 100px 84px; align-items: center; column-gap: 16px; }
.env-cols { padding: 8px 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 10.5px; font-weight: 650;
  text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.env-row { padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .1s; }
.env-row:last-child { border-bottom: 0; }
.env-row:hover { background: var(--panel-2); }
.env-row:focus-visible { outline-offset: -2px; }
.cell-env { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; }
.cell-urls { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.url-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 13px; }
.url-line .svc-name { font: 11px var(--mono); color: var(--faint); min-width: 38px; }
.url-line a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); border-bottom: 1px dotted var(--line-strong); }
.url-line a:hover { color: var(--accent); text-decoration: none; border-bottom-color: var(--accent); }
.cell-ref { min-width: 0; line-height: 1.35; }
.cell-ref .branch { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.cell-ref .tag { font: 11.5px var(--mono); color: var(--faint); }
.cell-when { font-size: 12.5px; line-height: 1.35; }
.cell-when .by { color: var(--faint); font-size: 11.5px; display: block; }
.cell-act { display: flex; justify-content: flex-end; }
.cell-act .btn { padding: 5px 11px; }
.dbstate { font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.state-label { display: none; }

/* ── Drawer ── */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--bg); border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg); z-index: 30; overflow-y: auto; transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1); }
.drawer.open { transform: none; }
.drawer-header { display: flex; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); z-index: 2; flex-wrap: wrap; }
.drawer-header h2 { font-size: 17px; font-weight: 650; letter-spacing: -.02em; }
.drawer-header .close-btn { margin-left: auto; }
.drawer section { margin: 14px 18px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.drawer section.flat { background: none; border: 0; padding: 0; }
.drawer h3 { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; }
.kv td:first-child { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; color: var(--muted); width: 1%; padding-right: 20px; }
.kv td { border: 0; padding: 4px 0; }
.kv tr:hover td { background: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.fact .v { font: 13px var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.svc-links { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.svc-links .url-line { font-size: 14px; }
.actions-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* databases */
.db { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--panel-2); margin-bottom: 10px; }
.db:last-child { margin-bottom: 0; }
.db-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.db-top .var { font: 600 13px var(--mono); }
.db-top .spacer { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.db-name { font: 12px var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.db-url { display: flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 6px 6px 10px; }
.db-url code { flex: 1; font: 12px var(--mono); overflow-wrap: anywhere; min-width: 0; }
.db-url.revealed { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: var(--warn-soft); }
.db-note { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

/* variables */
.env-vars-help { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.env-vars-list { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.env-vars-head, .env-var-row { display: grid; grid-template-columns: minmax(105px, .8fr) minmax(145px, 1.5fr) minmax(130px, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; }
.env-vars-head { background: var(--panel-2); color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.env-var-row { border-top: 1px solid var(--line); min-width: 0; }
.env-var-row.pending { background: var(--accent-soft); }
.env-var-key { min-width: 0; font: 12px/1.45 var(--mono); overflow-wrap: anywhere; }
.env-var-value { display: flex; align-items: center; gap: 6px; min-width: 0; font: 12px/1.45 var(--mono); overflow-wrap: anywhere; }
.env-var-value [data-val] { min-width: 0; overflow-wrap: anywhere; }
.env-var-source { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-width: 0; }
.source-badge, .pending-badge, .managed-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--muted); font-size: 10.5px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
.source-badge.repo { color: var(--develop); background: var(--develop-soft); border-color: transparent; }
.source-badge.console { color: var(--preview); background: var(--preview-soft); border-color: transparent; }
.pending-badge { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.env-var-scope { width: 100%; color: var(--muted); font-size: 10.5px; overflow-wrap: anywhere; }
.env-var-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 5px; }
.env-var-actions .btn { font-size: 11.5px; }
.env-var-form { padding: 12px; margin-top: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.env-var-form-title { font-size: 12px; font-weight: 650; margin-bottom: 8px; }
.env-var-form .row { margin: 6px 0 0; }
.env-var-form input { min-width: 0; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 18px;
  border-radius: 999px; z-index: 50; display: none; max-width: 90vw; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); }
#overlay { display: none; position: fixed; inset: 0; background: rgba(12,13,16,.42); z-index: 25; backdrop-filter: blur(1.5px); }
#overlay.on { display: block; }

/* ── Responsive ── */
@media (max-width: 1100px) {
  .env-grid { grid-template-columns: 16px 104px minmax(180px, 1.4fr) minmax(120px, 1fr) 100px 84px; }
  .env-grid .c-db { display: none; }
}
@media (max-width: 860px) {
  #sidebar { transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
  body.menu-open #sidebar { transform: none; }
  #main { margin-left: 0; }
  #menuBtn { display: inline-flex; }
  #topbar { padding: 0 16px; } #content { padding: 18px 16px 48px; }
  #topbar .links, #topbar .meta { display: none; }
  .env-cols { display: none; }
  .env-grid { grid-template-columns: 16px 1fr auto; row-gap: 6px; }
  .env-row .c-env { grid-column: 2; } .env-row .cell-act { grid-column: 3; grid-row: 1; }
  .env-row .cell-urls, .env-row .cell-ref, .env-row .cell-when, .env-row .c-db { grid-column: 2 / 4; display: block; }
  .state-label { display: inline; color: var(--faint); font-size: 11px; margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .env-vars-head { display: none; }
  .env-var-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; padding: 12px; }
  .env-var-form .row > * { flex: 1 1 100%; width: 100% !important; }
  .toolbar .summary { margin-left: 0; }
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="8" fill="#17181c"/>
      <path d="M8 19l4-5-4-5M15 19h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="brand-name">Infra Console</div>
      <div class="brand-sub" id="sidebarDomain">loading…</div>
    </div>
  </div>
  <nav>
    <button data-tab="envs" class="on">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
      Environments
    </button>
    <button data-tab="projects">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M2 4a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6M5 5.5h6M5 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Projects
    </button>
    <button data-tab="vars">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Variables
    </button>
    <button data-tab="activity">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M8 2v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/></svg>
      Activity
    </button>
    <button data-tab="access" hidden>
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 14v-1.5A3.5 3.5 0 015 9h2a3.5 3.5 0 013.5 3.5V14M11 3.5a2 2 0 010 4M12 9.5a3 3 0 012.5 3V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Access
    </button>
  </nav>
  <div class="sidebar-footer">
    <div id="sidebarUser" style="margin-bottom:6px;color:#64748b"></div>
    <div id="sidebarLinks" style="display:flex;flex-direction:column;gap:4px"></div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button class="btn ghost" id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <h1 id="topTitle">Environments</h1>
    <span class="meta" id="topMeta"></span>
    <div class="links" id="topLinks"></div>
  </div>
  <div id="content">
    <div id="tab-envs"></div>
    <div id="tab-projects" hidden></div>
    <div id="tab-vars" hidden></div>
    <div id="tab-activity" hidden></div>
    <div id="tab-access" hidden></div>
  </div>
</div>

<div id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STATE = { deployments: [], settings: {} };
let current = null;
let lastOut = { key: '', html: '' };

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Infra-Console': '1' }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}
function ago(ts) {
  if (!ts) return '';
  const s = Date.now() / 1000 - Number(ts);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
function envClass(env) { return env.startsWith('pr-') ? 'preview' : env; }
function envBadge(env) {
  const c = envClass(env);
  const cls = ['prod','staging','develop','preview'].includes(c) ? c : 'develop';
  return `<span class="badge env-${cls}">${esc(env)}</span>`;
}
function hostLink(url) {
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\//, ''))}</a>` : '<span class="muted">—</span>';
}
function byApp() { const m = {}; for (const d of STATE.deployments) (m[d.APP] ||= []).push(d); return m; }
const ORDER = { prod: 0, staging: 1, develop: 2 };
const sortEnvs = list => list.sort((a, b) => (ORDER[a.ENV_NAME] ?? 3) - (ORDER[b.ENV_NAME] ?? 3) || a.ENV_NAME.localeCompare(b.ENV_NAME, undefined, { numeric: true }));
const CONNECTED_LABEL = c => c === 'own' ? 'its own database' : c?.startsWith('platform:') ? `platform DB ${c.slice(9)}` : c?.startsWith('external:') ? `external on ${c.slice(9)}` : 'none';

const TAB_TITLES = { envs: 'Environments', projects: 'Projects', vars: 'Variables', activity: 'Activity', access: 'Organizations & access' };

async function load() {
  STATE = await api('/api/state');
  const s = STATE.settings;
  const base = d => `https://${d}.${s.domain}${s.suffix}`;
  $('#sidebarDomain').textContent = s.domain || s.server;
  $('#sidebarUser').textContent = STATE.user || 'unknown';
  const platformAdmin = STATE.access?.platform_admin;
  const orgAdmin = STATE.access?.organizations?.some(org => org.role === 'org_admin');
  const canManageVars = platformAdmin || STATE.deployments.some(d => d.ROLE === 'maintainer');
  document.querySelector('#sidebar nav button[data-tab=projects]').hidden = !platformAdmin;
  document.querySelector('#sidebar nav button[data-tab=activity]').hidden = !platformAdmin;
  document.querySelector('#sidebar nav button[data-tab=access]').hidden =
    !['authentik', 'keycloak'].includes(STATE.access?.auth_mode) || (!platformAdmin && !orgAdmin);
  document.querySelector('#sidebar nav button[data-tab=vars]').hidden = !canManageVars;
  const links = platformAdmin
    ? [['Traefik', base('traefik')], ['Logs', base('logs')], ['Status', base('status')]]
    : [['Status', base('status')]];
  $('#sidebarLinks').innerHTML = links
    .map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('')
    + (STATE.access?.auth_mode === 'keycloak' ? '<a href="/oauth2/sign_out?rd=%2Fsigned-out" style="margin-top:6px">Sign out</a>' : '');
  $('#topMeta').textContent = s.server;
  $('#topLinks').innerHTML = (platformAdmin
    ? [['Traefik', base('traefik')], ['Container logs', base('logs')], ['Uptime', base('status')]]
    : [['Uptime', base('status')]])
    .map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener"><svg width="12" height="12" fill="none" viewBox="0 0 12 12"><path d="M2 10L10 2M10 2H5M10 2v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>${n}</a>`).join('');
  if (STATE.access?.auth_mode === 'keycloak') {
    $('#topLinks').innerHTML += '<a href="/oauth2/sign_out?rd=%2Fsigned-out">Sign out</a>';
  }
  renderEnvs();
  if (!$('#tab-vars').hidden) renderVars();
  if (current) openDrawer(current.app, current.env, true);
}

// ── Environments tab ──────────────────────────────────────────────────────────
let FILTER = { q: '', cls: 'all', attention: false };
try { Object.assign(FILTER, JSON.parse(localStorage.getItem('infra.envFilter') || '{}'), { q: '' }); } catch (_) {}
const saveFilter = () => { try { localStorage.setItem('infra.envFilter', JSON.stringify({ cls: FILTER.cls, attention: FILTER.attention })); } catch (_) {} };

function serviceUrls(d) {            // [{svc, url}] — one per service when the deploy recorded them
  const out = [];
  for (const part of String(d.URLS || '').split(/\s+/).filter(Boolean)) {
    const i = part.indexOf('=');
    if (i > 0) out.push({ svc: part.slice(0, i), url: part.slice(i + 1) });
  }
  if (!out.length && d.URL) out.push({ svc: (d.SERVICES || [])[0] || '', url: d.URL });
  return out;
}
const urlHost = u => u.replace(/^https?:\/\//, '');
function urlLines(d) {
  const urls = serviceUrls(d);
  if (!urls.length) return '<span class="muted">—</span>';
  return urls.map(u => `<div class="url-line">${urls.length > 1 || (d.SERVICES || []).length > 1 ? `<span class="svc-name">${esc(u.svc)}</span>` : ''}<a href="${esc(u.url)}" target="_blank" rel="noopener" title="${esc(u.url)}" onclick="event.stopPropagation()">${esc(urlHost(u.url))}</a></div>`).join('');
}
function attentionOf(d) {             // → [{level, why}] in priority order
  const out = [];
  if (d.STATE === 'blocked') out.push({ level: 'bad', why: `deploy blocked — missing ${d.MISSING.join(', ')}` });
  else if (d.MISSING?.length) out.push({ level: 'bad', why: `missing ${d.MISSING.join(', ')}` });
  if (d.STATE === 'down') out.push({ level: 'bad', why: 'no containers running' });
  if (d.UPCOMING_MISSING?.length) out.push({ level: 'warn', why: `will miss ${d.UPCOMING_MISSING.join(', ')} once newer code arrives` });
  if (d.DB_PENDING?.length) out.push({ level: 'info', why: `${d.DB_PENDING.length} database${d.DB_PENDING.length > 1 ? 's' : ''} to create (${d.DB_PENDING.join(', ')})` });
  return out;
}
function dbCell(d) {
  if (d.DB_PENDING?.length) return `<span class="chip info" style="margin:0" title="${esc(d.DB_PENDING.join(', '))}">${d.DB_PENDING.length} to create</span>${d.HAS_OWN_DB ? '<span class="chip ok">created</span>' : ''}`;
  return d.HAS_OWN_DB ? '<span class="chip ok" style="margin:0">created</span>' : '<span class="muted">—</span>';
}
function matchesFilter(d) {
  if (FILTER.cls !== 'all' && envClass(d.ENV_NAME) !== FILTER.cls) return false;
  if (FILTER.attention && !attentionOf(d).some(a => a.level !== 'info')) return false;
  const q = FILTER.q.trim().toLowerCase();
  if (q && ![d.APP, d.ENV_NAME, d.BRANCH, d.TAG, ...(d.SERVICES || [])].join(' ').toLowerCase().includes(q)) return false;
  return true;
}

function grantLabel(g) {
  const where = !g.scope ? 'the whole project' : g.scope.replace(/^env:/, 'environment ').replace(/^class:/, 'all ').replace(/^branch:/, 'branch ');
  return `${esc(g.role)} on <b>${esc(g.app)}</b> · ${esc(where)}`;
}
function invitationsBanner() {
  const mine = STATE.access?.my_invitations || [];
  if (!mine.length) return '';
  return mine.map(i => `<div class="attention" style="border-color:var(--accent)">
    <div class="attention-head" style="background:var(--accent-soft)"><span class="dot up"></span>You're invited to <b>&nbsp;${esc(i.organization_name)}</b>
      <span class="muted" style="font-weight:400">&nbsp;· expires ${esc(new Date(i.expires_at * 1000).toLocaleDateString())}</span></div>
    <div style="padding:12px 16px">
      <div class="muted" style="font-size:12.5px;margin-bottom:8px">Accepting makes you a member of ${esc(i.organization_name)}${i.member_role === 'org_admin' ? ' <b>as an organization administrator</b>' : ''}${i.grants.length ? ' and gives you:' : '.'}</div>
      ${i.grants.length ? `<ul style="margin:0 0 10px 18px;font-size:13px">${i.grants.map(g => `<li>${grantLabel(g)}</li>`).join('')}</ul>` : ''}
      <button class="btn primary" data-inv="accept|${esc(i.id)}">Accept</button>
      <button class="btn" data-inv="decline|${esc(i.id)}">Decline</button>
    </div></div>`).join('');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-inv]');
  if (!b) return;
  const [op, id] = b.dataset.inv.split('|');
  b.disabled = true;
  try { await api('/api/invitations', { op, id }); toast(op === 'accept' ? 'Invitation accepted' : 'Invitation declined'); await load(); }
  catch (err) { toast(err.message); b.disabled = false; }
});

function renderEnvs() {
  const all = STATE.deployments;
  const apps = byApp(), names = Object.keys(apps).sort();
  if (!names.length) {
    const hasTenantIdentity = ['authentik', 'keycloak'].includes(STATE.access?.auth_mode) && !STATE.access?.platform_admin;
    const message = hasTenantIdentity
      ? 'No projects are assigned to your account yet. Ask your organization administrator to grant you a project role.'
      : 'Nothing deployed yet. Open a PR in an app repo, or run <span class="mono">infra deploy</span>.';
    $('#tab-envs').innerHTML = invitationsBanner() + `<div class="card"><div class="empty">${message}</div></div>`;
    return;
  }
  const up = all.filter(d => d.STATE === 'up').length;
  const previews = all.filter(d => d.ENV_NAME.startsWith('pr-')).length;
  const needs = all.flatMap(d => attentionOf(d).map(a => ({ d, ...a })));
  const urgent = needs.filter(n => n.level !== 'info');

  const classes = [['all', 'All'], ['prod', 'Prod'], ['staging', 'Staging'], ['develop', 'Develop'], ['preview', 'Previews']];
  const toolbar = `
    <div class="toolbar">
      <div class="search"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="envSearch" type="search" placeholder="Filter by app, environment, branch…" value="${esc(FILTER.q)}" aria-label="Filter environments"></div>
      <div class="seg" role="group" aria-label="Environment class">${classes.map(([k, l]) => `<button data-cls="${k}" class="${FILTER.cls === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="seg"><button id="envAttention" class="${FILTER.attention ? 'on' : ''}">Needs attention${urgent.length ? ` · ${urgent.length}` : ''}</button></div>
      <div class="summary"><span><b>${all.length}</b> environments</span><span><b style="color:var(--ok)">${up}</b> running</span>
        <span><b>${previews}</b>/${esc(STATE.settings.max_previews)} previews</span></div>
    </div>`;

  const attention = urgent.length ? `
    <div class="attention">
      <div class="attention-head"><span class="dot blocked"></span>${urgent.length} thing${urgent.length > 1 ? 's' : ''} need${urgent.length === 1 ? 's' : ''} attention</div>
      ${urgent.slice(0, 6).map(n => `<button class="attention-item" data-manage="${esc(n.d.APP)}|${esc(n.d.ENV_NAME)}">
        <span class="dot ${n.level === 'bad' ? 'down' : 'blocked'}"></span>
        <span><b>${esc(n.d.APP)}</b> ${envBadge(n.d.ENV_NAME)} <span class="why">${esc(n.why)}</span></span><span class="go">Open →</span></button>`).join('')}
    </div>` : '';

  const cards = names.map(app => {
    const rows = sortEnvs(apps[app]);
    const shown = rows.filter(matchesFilter);
    if (!shown.length) return '';
    const svcs = [...new Set(rows.flatMap(d => d.SERVICES || []))];
    const dots = rows.map(d => `<span class="dot ${d.STATE}" title="${esc(d.ENV_NAME)}: ${esc(d.STATE)}"></span>`).join('');
    return `<section class="app">
      <div class="app-head">
        <h2>${esc(app)}</h2>
        <span class="svc">${svcs.map(sv => `<span class="svc-tag">${esc(sv)}</span>`).join('')}</span>
        <span class="health">${dots}<span class="count">${shown.length === rows.length ? rows.length : shown.length + ' of ' + rows.length} env${rows.length !== 1 ? 's' : ''}</span></span>
      </div>
      <div class="env-grid env-cols"><span></span><span>Environment</span><span>Endpoints</span><span>Branch · tag</span><span class="c-db">Database</span><span>Deployed</span><span></span></div>
      ${shown.map(d => {
        const warns = attentionOf(d).filter(a => a.level !== 'info');
        const chips = warns.map(a => `<span class="chip ${a.level === 'bad' ? 'bad' : ''}" title="${esc(a.why)}">${esc(d.STATE === 'blocked' && a.level === 'bad' && a.why.startsWith('deploy') ? 'blocked' : a.why.split(' ')[0] === 'will' ? 'will miss ' + d.UPCOMING_MISSING.length : a.why.startsWith('no ') ? 'down' : (d.MISSING.length + ' missing'))}</span>`);
        return `<div class="env-grid env-row" tabindex="0" role="button" data-manage="${esc(d.APP)}|${esc(d.ENV_NAME)}" aria-label="Manage ${esc(d.APP)} ${esc(d.ENV_NAME)}">
          <span class="dot ${d.STATE}" title="${esc(d.STATE)}"></span>
          <div class="cell-env c-env">${envBadge(d.ENV_NAME)}${[...new Set(chips)].join('')}</div>
          <div class="cell-urls">${urlLines(d)}</div>
          <div class="cell-ref"><span class="branch" title="${esc(d.BRANCH || '')}">${esc(d.BRANCH || '—')}</span><span class="tag">${esc(d.TAG || '')}</span></div>
          <div class="dbstate c-db"><span class="state-label">Database</span>${dbCell(d)}</div>
          <div class="cell-when">${ago(d.DEPLOYED_AT || d.BLOCKED_AT)}<span class="by">${esc(d.DEPLOYED_BY || '')}</span></div>
          <div class="cell-act"><button class="btn" tabindex="-1">Manage</button></div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');

  const keepFocus = document.activeElement?.id === 'envSearch';
  $('#tab-envs').innerHTML = invitationsBanner() + toolbar + attention + (cards || '<div class="card"><div class="empty">No environments match this filter.</div></div>');
  const box = $('#envSearch');
  box.oninput = () => { FILTER.q = box.value; const pos = box.selectionStart; renderEnvs(); const nb = $('#envSearch'); nb.focus(); nb.setSelectionRange(pos, pos); };
  if (keepFocus) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  document.querySelectorAll('#tab-envs [data-cls]').forEach(b => b.onclick = () => { FILTER.cls = b.dataset.cls; saveFilter(); renderEnvs(); });
  $('#envAttention').onclick = () => { FILTER.attention = !FILTER.attention; saveFilter(); renderEnvs(); };
}

document.addEventListener('keydown', e => {
  const r = e.target.closest?.('.env-row');
  if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); }
  if (e.key === 'Escape') closeDrawer();
});
$('#menuBtn').onclick = () => document.body.classList.toggle('menu-open');
document.addEventListener('click', e => {
  if (e.target.closest('#sidebar nav button')) document.body.classList.remove('menu-open');
  const m = e.target.closest('[data-manage]');
  if (m) { const [a, en] = m.dataset.manage.split('|'); openDrawer(a, en); }
  const t = e.target.closest('#sidebar nav button');
  if (t) {
    document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.toggle('on', b === t));
    for (const id of ['envs', 'projects', 'vars', 'activity', 'access']) $('#tab-' + id).hidden = id !== t.dataset.tab;
    $('#topTitle').textContent = TAB_TITLES[t.dataset.tab] || '';
    if (t.dataset.tab === 'vars') renderVars();
    if (t.dataset.tab === 'activity') renderActivity();
    if (t.dataset.tab === 'projects') renderProjects();
    if (t.dataset.tab === 'access') renderAccess();
  }
});

// ── Drawer ────────────────────────────────────────────────────────────────────
async function openDrawer(app, env, refresh) {
  current = { app, env };
  const d = STATE.deployments.find(x => x.APP === app && x.ENV_NAME === env);
  if (!d) { closeDrawer(); return; }
  const dr = $('#drawer'), isPreview = env.startsWith('pr-');
  const platformAdmin = STATE.access?.platform_admin;
  const canOperate = platformAdmin || ['operator', 'maintainer'].includes(d.ROLE);
  const dbSources = STATE.deployments.filter(x => x.HAS_OWN_DB);

  const urls = serviceUrls(d);
  dr.innerHTML = `
  <div class="drawer-header">
    <h2>${esc(app)}</h2>${envBadge(env)}
    <span class="dot ${d.STATE}" title="${esc(d.STATE)}"></span><span class="muted" style="font-size:12.5px">${esc(d.STATE)}</span>
    <span class="badge">${esc((d.ROLE || 'platform admin').replace('_', ' '))}</span>
    <button class="btn ghost close-btn" id="drawerClose" aria-label="Close">✕</button>
  </div>
  <section class="flat" style="margin-bottom:0">
    <div class="actions-bar">
      ${canOperate ? '<button class="btn primary" data-act="redeploy">Redeploy</button><button class="btn" data-act="restart">Restart</button>' : ''}
      ${canOperate && d.PREV_TAG ? `<button class="btn" data-act="rollback">Roll back to <span class="mono">${esc(d.PREV_TAG.slice(0, 16))}</span></button>` : ''}
      ${platformAdmin ? '<button class="btn danger" data-act="destroy" style="margin-left:auto">Destroy…</button>' : ''}
      ${!canOperate && !platformAdmin ? '<span class="muted">Read-only project access</span>' : ''}
    </div>
  </section>
  ${d.MISSING?.length ? `<section style="border-color:var(--warn)"><div class="banner" style="border:0;padding:0;background:none"><b>${d.STATE === 'blocked' ? 'Deploy blocked' : 'Required variables missing'}:</b>
    <span class="mono"> ${d.MISSING.map(esc).join(', ')}</span><br>
    Add them under <a href="#" id="goVars">Variables → ${esc(app)}</a>, then
    ${canOperate ? '<button class="btn primary" data-act="redeploy" style="margin-top:8px">Retry deploy</button>' : ''}</div></section>` : ''}
  <section>
    <h3>Endpoints</h3>
    <div class="svc-links">${urls.length ? urls.map(u => `<div class="url-line"><span class="svc-name">${esc(u.svc)}</span><a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(urlHost(u.url))} ↗</a></div>`).join('') : '<span class="muted">—</span>'}</div>
    <div class="facts">
      <div class="fact"><div class="k">Branch</div><div class="v">${esc(d.BRANCH || '—')}</div></div>
      <div class="fact"><div class="k">Image tag</div><div class="v">${esc(d.TAG || '—')}</div></div>
      <div class="fact"><div class="k">Commit</div><div class="v">${esc((d.COMMIT || '').slice(0, 10) || '—')}</div></div>
      <div class="fact"><div class="k">Deployed</div><div class="v">${ago(d.DEPLOYED_AT || d.BLOCKED_AT) || '—'}${d.DEPLOYED_BY ? ' · ' + esc(d.DEPLOYED_BY) : ''}</div></div>
    </div>
    ${isPreview ? '<div class="muted" style="margin-top:12px;font-size:12.5px">Preview login: use the preview basic-auth credentials from the inventory.</div>' : ''}
  </section>
  <section><h3>Databases</h3><div id="dbBox" class="muted">loading…</div></section>
  <section><h3>Container resources</h3><div id="resourcesBox" class="muted">loading…</div></section>
  <section><h3>Environment variables</h3><div id="varsBox" class="muted">loading…</div></section>
  <section>
    <h3>Logs <button class="btn" id="loadLogs" style="margin-left:auto;font-size:12px">Load last 200 lines</button></h3>
    <div id="logOut"></div>
  </section>
  <section>
    <h3>Output</h3>
    <div id="out" class="muted" style="font-size:13px">${lastOut.key === app + '/' + env ? lastOut.html : 'Results of actions appear here.'}</div>
  </section>`;

  dr.classList.add('open');
  $('#overlay').classList.add('on');

  $('#drawerClose', dr).onclick = closeDrawer;
  $('#overlay').onclick = closeDrawer;
  $('#goVars', dr)?.addEventListener('click', e => {
    e.preventDefault(); closeDrawer();
    document.querySelector('#sidebar nav button[data-tab=vars]').click();
    $('#varApp').value = app; renderVarsFor(app);
  });
  dr.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b, app, env, b.dataset.act));
  renderEnvVars(dr, app, env);
  renderDatabase(dr, app, env, dbSources);
  renderResources(dr, app, env);
  $('#loadLogs', dr).onclick = async e => {
    e.target.disabled = true;
    try { const j = await api(`/api/logs?app=${app}&env=${env}&n=200`); $('#logOut', dr).innerHTML = `<pre>${esc(j.output)}</pre>`; }
    finally { e.target.disabled = false; }
  };
}

const PLATFORM_MANAGED_KEYS = new Set(['APP_NAME', 'APP_ENV', 'ENV_CLASS', 'IS_PREVIEW', 'PORT', 'PUBLIC_URL', 'INFRA_DOMAIN', 'IMAGE_TAG', 'GIT_BRANCH', 'GIT_COMMIT']);
const ORIGIN_LABEL = { platform: 'Platform managed', repo: 'Repository', console: 'Console override', deleted: 'Removed' };

async function renderResources(dr, app, env) {
  const box = $('#resourcesBox', dr);
  const data = await api(`/api/resources?app=${encodeURIComponent(app)}&env=${encodeURIComponent(env)}`)
    .catch(e => ({ error: e.message }));
  if (data.error) { box.textContent = data.error; return; }
  const defaults = data.defaults, scopes = data.scopes;
  const selected = box.querySelector('#resourceScope')?.value;
  const scope = scopes.includes(selected) ? selected : env;
  box.classList.remove('muted');
  box.innerHTML = `
    <p class="env-vars-help">Infra-owned CPU and memory caps; app manifests cannot set these. Use memory units such as <span class="mono">256m</span> or <span class="mono">1g</span> and CPU values such as <span class="mono">0.5</span>. Changes apply on the next deploy; per-container and per-stack ceilings are enforced.</p>
    ${data.can_manage ? `<div class="row">
      <label for="resourceScope">Override scope</label>
      <select id="resourceScope">${scopes.map(s => `<option value="${esc(s)}" ${scope === s ? 'selected' : ''}>${s === 'common' ? 'All environments' : s === 'preview' ? 'All previews' : `Only ${esc(s)}`}</option>`).join('')}</select>
      <span class="muted" style="font-size:12px">Container ceiling: ${esc(defaults.max_container_mem_limit)} / ${esc(defaults.max_container_cpus)} CPU · stack ceiling: ${esc(defaults.max_stack_mem_limit)} / ${esc(defaults.max_stack_cpus)} CPU</span>
    </div>` : `<p class="muted">Resource allocations are managed by the platform administrator.</p>`}
    <div class="resource-grid">${data.components.map(item => {
      const override = item.overrides[scope] || {};
      const mem = override.mem_limit || item.effective.mem_limit;
      const cpus = override.cpus || item.effective.cpus;
      return `<div class="resource-card" data-resource="${esc(item.component)}">
        <h4>${esc(item.component)}</h4>
        ${data.can_manage ? `<div class="resource-fields">
          <label>Memory limit<input data-resource-mem value="${esc(mem)}" aria-label="${esc(item.component)} memory limit"></label>
          <label>CPU limit<input data-resource-cpus value="${esc(cpus)}" inputmode="decimal" aria-label="${esc(item.component)} CPU limit"></label>
        </div>` : ''}
        <div class="resource-effective">Currently effective: <span class="mono">${esc(item.effective.mem_limit)} · ${esc(item.effective.cpus)} CPU</span></div>
        ${data.can_manage ? `<div class="row">
          <button class="btn primary" data-resource-save>Save override</button>
          <button class="btn" data-resource-reset ${override.mem_limit || override.cpus ? '' : 'disabled'}>Reset scope</button>
        </div>` : ''}
        <div data-resource-output></div>
      </div>`;
    }).join('')}</div>`;

  if (!data.can_manage) return;
  $('#resourceScope', box).onchange = () => renderResources(dr, app, env);
  box.querySelectorAll('[data-resource]').forEach(card => {
    const component = card.dataset.resource;
    const send = async (body, message) => {
      const button = card.querySelector('[data-resource-save]');
      button.disabled = true;
      try {
        await api('/api/resources', { app, env, component, scope, ...body });
        toast(message);
        await renderResources(dr, app, env);
      } catch (e) {
        card.querySelector('[data-resource-output]').innerHTML = `<div class="chip">${esc(e.message)}</div>`;
      } finally { button.disabled = false; }
    };
    card.querySelector('[data-resource-save]').onclick = () => {
      const mem_limit = card.querySelector('[data-resource-mem]').value.trim();
      const cpus = card.querySelector('[data-resource-cpus]').value.trim();
      send({ mem_limit, cpus }, `${component} resource policy saved — redeploy to apply`);
    };
    card.querySelector('[data-resource-reset]').onclick = () =>
      send({ reset: true }, `${component} ${scope} override removed`);
  });
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  try {
    const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  } catch (_) { return false; }
}

async function renderDatabase(dr, app, env, dbSources) {
  const box = $('#dbBox', dr);
  const i = await api(`/api/database?app=${app}&env=${env}`).catch(e => ({ error: e.message }));
  if (i.error) { box.textContent = i.error; return; }
  const dbs = i.databases || [];
  const others = dbSources.filter(x => !(x.APP === app && x.ENV_NAME === env));
  box.classList.remove('muted');
  if (!dbs.length) { box.innerHTML = '<span class="muted">This app declares no databases in <span class="mono">.infradeploy/infra.yml</span>.</span>'; return; }
  const status = d => d.created
    ? (d.exists ? `<span class="chip ok" style="margin:0">created</span><span class="muted" style="font-size:12px">${esc(d.size)}</span>` : '<span class="chip bad" style="margin:0">missing in Postgres</span>')
    : d.wiped ? '<span class="chip" style="margin:0">wiped</span>' : '<span class="chip quiet" style="margin:0">not created</span>';
  const pending = dbs.filter(d => !d.created);
  box.innerHTML = `
    ${dbs.map(d => `<div class="db" data-db="${esc(d.id)}">
      <div class="db-top">
        <span class="var">${esc(d.inject_as)}</span><span class="svc-tag">${esc(d.service)}</span>${status(d)}
        <span class="spacer">
          ${i.can_manage && !d.created ? `<button class="btn primary" data-dbcreate="${esc(d.id)}">${d.wiped ? 'Recreate (empty)' : 'Create database'}</button>` : ''}
          ${i.can_wipe && d.created ? `<button class="btn danger" data-dbwipe="${esc(d.id)}">Wipe…</button>` : ''}
        </span>
      </div>
      <div class="db-name">${esc(d.name)}</div>
      ${d.created ? `<div class="db-url" data-urlbox><code data-urltext>${esc(d.url_masked || '')}</code>
        ${i.can_reveal ? `<button class="btn" data-dbreveal="${esc(d.id)}">Reveal</button>` : ''}</div>` : ''}
    </div>`).join('')}
    <p class="db-note">Declared databases are <b>not</b> created automatically. Creating one provisions it in the shared Postgres and redeploys this environment so its URL is injected as <span class="mono">${esc(dbs.map(d => d.inject_as).join(', '))}</span>.
      ${i.can_reveal ? '' : 'Only platform administrators can reveal the full connection URL.'}</p>
    <div class="row">${i.can_manage && pending.length > 1 ? `<button class="btn primary" id="dbCreateAll">Create all (${pending.length})</button>` : ''}</div>
    ${others.length && i.can_manage && dbs.some(d => d.created) ? `<div class="row" style="margin-top:4px">Point a variable at another environment's database
      <select id="dbFrom">${others.map(x => `<option value="${esc(x.APP)}/${esc(x.ENV_NAME)}">${esc(x.APP)} / ${esc(x.ENV_NAME)}</option>`).join('')}</select>
      as <input id="dbKey2" placeholder="variable name" class="mono" style="width:180px">
      <button class="btn" id="dbUseOther">Set variable</button></div>` : ''}
    <div id="dbOut"></div>`;

  const done = async (r, what) => {
    $('#dbOut', box).innerHTML = `<pre>${esc(r.output || r.error || '')}</pre>`;
    toast(r.ok ? what : 'Failed — see output');
    renderDatabase(dr, app, env, dbSources); renderEnvVars(dr, app, env);
  };
  box.querySelectorAll('[data-dbcreate]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true; toast('Creating and redeploying…');
    done(await api('/api/dbop', { app, env, op: 'create', db: btn.dataset.dbcreate }), 'Database created and injected');
  });
  $('#dbCreateAll', box)?.addEventListener('click', async () => {
    toast('Creating and redeploying…');
    done(await api('/api/dbop', { app, env, op: 'create' }), 'Databases created and injected');
  });
  box.querySelectorAll('[data-dbwipe]').forEach(btn => btn.onclick = async () => {
    const c = prompt(`Wipe database ${btn.dataset.dbwipe} of ${app}/${env}? All data is deleted.\nType ${app}/${env} to confirm:`);
    if (c !== `${app}/${env}`) return toast('Not confirmed');
    done(await api('/api/dbop', { app, env, op: 'wipe', db: btn.dataset.dbwipe, confirm: c }), 'Database wiped');
  });
  // Reveal the full URL: platform admins only (enforced server-side, audited). Auto-hides after 30 s.
  box.querySelectorAll('[data-dbreveal]').forEach(btn => btn.onclick = async () => {
    const wrap = btn.closest('[data-urlbox]'), code = $('[data-urltext]', wrap), masked = code.textContent;
    btn.disabled = true;
    try {
      const r = await api(`/api/database/reveal?app=${encodeURIComponent(app)}&env=${encodeURIComponent(env)}&db=${encodeURIComponent(btn.dataset.dbreveal)}`);
      code.textContent = r.url; wrap.classList.add('revealed');
      wrap.querySelectorAll('.extra').forEach(n => n.remove());
      const copy = document.createElement('button'); copy.className = 'btn extra'; copy.textContent = 'Copy';
      const hide = document.createElement('button'); hide.className = 'btn ghost extra'; hide.textContent = 'Hide';
      wrap.append(copy, hide); btn.hidden = true;
      const restore = () => { code.textContent = masked; wrap.classList.remove('revealed'); wrap.querySelectorAll('.extra').forEach(n => n.remove()); btn.hidden = false; btn.disabled = false; clearTimeout(timer); };
      const timer = setTimeout(restore, 30000);
      copy.onclick = async () => toast((await copyText(r.url)) ? 'URL copied' : 'Copy failed — select the text manually');
      hide.onclick = restore;
    } catch (e) { toast(e.message); btn.disabled = false; }
  });
  $('#dbUseOther', box)?.addEventListener('click', async () => {
    const from = $('#dbFrom', box).value, key = $('#dbKey2', box).value.trim();
    if (!key) return toast('Enter the variable name your app uses for the DB connection');
    let allow_prod = false;
    if (from.endsWith('/prod')) {
      if (!window.confirm(`Point ${app}/${env} at the PROD database ${from}?`)) return;
      allow_prod = true;
    }
    done(await api('/api/dbop', { app, env, op: 'use', from, key, scope: env, allow_prod }), `${key} → ${from} — redeploy to apply`);
  });
}

async function renderEnvVars(dr, app, env) {
  const box = $('#varsBox', dr);
  const j = await api(`/api/vars?app=${app}&env=${env}`).catch(e => ({ error: e.message }));
  if (j.error) { box.textContent = j.error; return; }
  const comps = Object.keys(j.components);
  const isPr = env.startsWith('pr-'), cls = envClass(env);
  const scopeOpts = [
    [env, isPr ? `only ${env}` : env],
    ...(isPr ? [['preview', `all ${app} previews`]] : []),
    ['common', `all ${app} environments`],
  ];
  const pending = Object.values(j.components).flat().filter(v => v.pending).length;
  const sourceScope = v => v.origin === 'console'
    ? (v.scope === 'common' ? 'All environments' : v.scope)
    : v.origin === 'repo' ? v.scope : '';

  box.classList.remove('muted');
  box.innerHTML = `
    <p class="env-vars-help">Values and sources for this deployment. Platform-managed settings are read-only. Add or edit app overrides below; changes apply on the next deploy.</p>
    ${pending ? `<div class="banner" style="margin-bottom:10px">${pending} change(s) pending. <button class="btn primary" id="varsRedeploy" style="margin-left:8px">Redeploy now</button></div>` : ''}
    ${comps.map(c => `
      ${comps.length > 1 ? `<div style="font-weight:600;font-size:13px;margin:12px 0 6px">${esc(c)}</div>` : ''}
      <div class="env-vars-list" role="list" aria-label="${esc(c)} environment variables">
        <div class="env-vars-head" aria-hidden="true"><span>Variable</span><span>Configured value</span><span>Source</span><span>Actions</span></div>
        ${j.components[c].map(v => {
          const platformManaged = v.origin === 'platform' || PLATFORM_MANAGED_KEYS.has(v.key);
          const source = ORIGIN_LABEL[v.origin] || v.origin;
          const scope = sourceScope(v);
          return `<div class="env-var-row${v.pending ? ' pending' : ''}" role="listitem">
            <div class="env-var-key">${esc(v.key)}</div>
            <div class="env-var-value"><span data-val="${esc(c)}|${esc(v.key)}">${esc(v.value)}</span>
              ${v.sensitive && STATE.access?.platform_admin ? `<button class="btn" data-reveal="${esc(c)}|${esc(v.key)}" aria-label="Reveal ${esc(v.key)}">Show</button>` : ''}</div>
            <div class="env-var-source"><span class="source-badge ${esc(v.origin)}">${esc(source)}</span>
              ${scope ? `<span class="env-var-scope">${esc(scope)}</span>` : ''}
              ${v.pending ? '<span class="pending-badge">Pending deploy</span>' : ''}</div>
            <div class="env-var-actions">
              ${!v.editable ? '<span class="muted">Read only</span>' : platformManaged
                ? `<span class="managed-badge">Platform managed</span>
                   ${v.origin === 'console' ? `<button class="btn danger" data-vdel="${esc(v.scope)}|${esc(v.key)}">Remove override</button>` : ''}`
                : `<button class="btn" data-vedit="${esc(c)}|${esc(v.key)}|${esc(v.origin === 'console' ? v.scope : '')}">${v.origin === 'console' ? 'Edit override' : 'Add override'}</button>
                   ${v.origin === 'console' ? `<button class="btn danger" data-vdel="${esc(v.scope)}|${esc(v.key)}">Remove</button>` : ''}`}
            </div>
          </div>`;
        }).join('')}
      </div>`).join('')}
    <div class="env-var-form">
      <div class="env-var-form-title">Add an app override</div>
      <p class="env-vars-help">Overrides take precedence over repository values. Platform-managed settings cannot be changed.</p>
      <div class="row">
        <input id="vKey" placeholder="VARIABLE_NAME" aria-label="Variable name" class="mono" style="width:170px">
        <input id="vVal" placeholder="Value" aria-label="Variable value" class="mono" style="flex:1;min-width:160px">
      </div>
      <div class="row">
        <label for="vScope" class="muted">Apply to</label>
        <select id="vScope">${scopeOpts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
        ${comps.length > 1 ? `<select id="vComp" aria-label="Component"><option value="">All components</option>${comps.map(c => `<option value=".${esc(c)}">${esc(c)} only</option>`).join('')}</select>` : ''}
        <button class="btn" id="vSave">Save</button>
        <button class="btn primary" id="vSaveDeploy">Save &amp; redeploy</button>
      </div>
    </div>`;

  const save = async redeploy => {
    const key = $('#vKey', box).value.trim(), value = $('#vVal', box).value;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return toast('Key must look like MY_KEY');
    if (PLATFORM_MANAGED_KEYS.has(key)) return toast(`${key} is managed by the platform and cannot be overridden`);
    const scope = $('#vScope', box).value + ($('#vComp', box)?.value || '');
    try {
      await api('/api/secret', { app, scope, key, value });
      toast(`${key} saved for ${scope}`);
      if (redeploy) return act($('#vSaveDeploy', box), app, env, 'redeploy');
      renderEnvVars(dr, app, env);
    } catch (e) { toast(e.message); }
  };
  $('#vSave', box).onclick = () => save(false);
  $('#vSaveDeploy', box).onclick = () => save(true);
  $('#varsRedeploy', box)?.addEventListener('click', e => act(e.target, app, env, 'redeploy'));
  box.querySelectorAll('[data-vedit]').forEach(b => b.onclick = () => {
    const [c, key, scope] = b.dataset.vedit.split('|');
    $('#vKey', box).value = key; $('#vVal', box).value = ''; $('#vVal', box).placeholder = `new value for ${key}`;
    if (scope) { const [base, part] = scope.split('.'); $('#vScope', box).value = base; if ($('#vComp', box)) $('#vComp', box).value = part ? '.' + part : ''; }
    else { $('#vScope', box).value = env; if ($('#vComp', box) && comps.length > 1) $('#vComp', box).value = '.' + c; }
    $('#vVal', box).focus();
    $('#vKey', box).scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  box.querySelectorAll('[data-vdel]').forEach(b => b.onclick = async () => {
    const [scope, key] = b.dataset.vdel.split('|');
    if (!window.confirm(`Delete ${key} (${scope === 'common' ? 'all environments' : scope})?`)) return;
    await api('/api/secret', { app, scope, key, value: null }); toast(`${key} deleted`); renderEnvVars(dr, app, env);
  });
  box.querySelectorAll('[data-reveal]').forEach(b => b.onclick = async () => {
    const [c, key] = b.dataset.reveal.split('|');
    const r = await api(`/api/reveal?app=${app}&env=${env}&comp=${c}&key=${key}`);
    box.querySelector(`[data-val="${c}|${key}"]`).textContent = r.value ?? '';
    b.remove();
  });
}

function closeDrawer() {
  current = null;
  $('#drawer').classList.remove('open');
  $('#overlay').classList.remove('on');
}

async function run(btn, path, body) {
  btn.disabled = true;
  const out = $('#out');
  if (out) out.innerHTML = '<span class="muted">Working… (a redeploy can take a minute)</span>';
  try {
    const j = await api(path, body);
    lastOut = { key: current ? current.app + '/' + current.env : '', html: `<pre>${esc(j.output || 'done')}</pre>` };
    if (out) out.innerHTML = lastOut.html;
    toast(j.ok === false ? 'Failed — see output' : 'Done ✓');
    await load();
  } catch (e) { if (out) out.innerHTML = `<pre>${esc(e.message)}</pre>`; toast(e.message); }
  finally { btn.disabled = false; }
}
async function act(btn, app, env, action) {
  let confirm;
  if (action === 'destroy') {
    confirm = prompt(`This deletes ${app}/${env}, its containers and its own database.\nType ${app}/${env} to confirm:`);
    if (confirm !== `${app}/${env}`) return toast('Not confirmed');
  } else if (env === 'prod' && !window.confirm(`${action} PROD for ${app}?`)) return;
  run(btn, '/api/action', { app, env, action, confirm });
}
</script>

<script>
// ── Variables tab ─────────────────────────────────────────────────────────────
function renderVars() {
  const apps = Object.keys(byApp()).filter(app => STATE.access?.platform_admin
    || byApp()[app].some(d => d.ROLE === 'maintainer')).sort();
  const el = $('#tab-vars');
  if (!el.dataset.ready) {
    el.innerHTML = `<div class="card">
      <div class="card-header"><h2>Variables &amp; Secrets</h2></div>
      <div style="padding:16px 18px">
        <div class="row">App
          <select id="varApp"></select>
          <input id="varAppNew" placeholder="or type an app name" style="width:200px">
        </div>
        <p class="muted" style="font-size:12.5px;margin-top:8px">Precedence (later wins): repo <span class="mono">.infradeploy/env</span> → <b>all</b> → <b>class</b> → <b>one environment</b>. Target one service by appending <span class="mono">.&lt;service&gt;</span> to the scope.</p>
      </div>
      <div id="varBody"></div>
    </div>`;
    el.dataset.ready = 1;
    $('#varApp').onchange = () => renderVarsFor($('#varApp').value);
    $('#varAppNew').onchange = () => renderVarsFor($('#varAppNew').value.trim());
  }
  const sel = $('#varApp'), keep = sel.value;
  sel.innerHTML = apps.map(a => `<option>${esc(a)}</option>`).join('');
  if (keep && apps.includes(keep)) sel.value = keep;
  if (sel.value) renderVarsFor(sel.value);
}

async function renderVarsFor(app) {
  if (!app) return;
  const j = await api(`/api/secrets?app=${encodeURIComponent(app)}`);
  const envs = sortEnvs(STATE.deployments.filter(d => d.APP === app));
  const scopes = new Set(['common', 'preview', 'develop', 'staging', 'prod', ...envs.map(d => d.ENV_NAME), ...Object.keys(j.files)]);
  const svcNames = [...new Set(envs.flatMap(d => d.SERVICES || []))].sort();
  const missing = envs.filter(d => d.MISSING?.length);
  const upcoming = envs.filter(d => d.UPCOMING_MISSING?.length);
  const label = s => s === 'common' ? 'all environments' : s === 'preview' ? 'all previews' : s.includes('.') ? `${s.split('.')[0]} · ${s.split('.')[1]} only` : s;

  $('#varBody').innerHTML = `
    ${missing.length ? `<div style="padding:0 18px 12px"><div class="banner"><b>Missing required variables</b><br>${missing.map(d => `${envBadge(d.ENV_NAME)} <span class="mono">${d.MISSING.map(esc).join(', ')}</span>`).join('<br>')}</div></div>` : ''}
    ${upcoming.length ? `<div style="padding:0 18px 12px"><div class="banner"><b>Will be missing once newer code reaches them</b><br>${upcoming.map(d => `${envBadge(d.ENV_NAME)} <span class="mono">${d.UPCOMING_MISSING.map(esc).join(', ')}</span>`).join('<br>')}</div></div>` : ''}
    ${j.can_manage ? `<div style="padding:12px 18px;border-bottom:1px solid var(--line)">
      <div class="row">
        <select id="nScope">${[...scopes].map(s => `<option value="${esc(s)}">${esc(label(s))}</option>`).join('')}</select>
        <select id="nComp"><option value="">all services</option>${svcNames.map(n => `<option value=".${esc(n)}">${esc(n)} only</option>`).join('')}</select>
        <input id="nKey" placeholder="KEY" class="mono" style="width:180px">
        <input id="nVal" placeholder="value" class="mono" style="flex:1;min-width:180px">
        <button class="btn primary" id="nSave">Save</button>
      </div>
      <div class="row" style="margin-top:4px">Redeploy affected: <span id="affected"></span></div>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:12.5px">📋 Bulk import — paste a .env block</summary>
        <div style="margin-top:8px">
          <textarea id="bulkEnv" rows="8" placeholder="KEY=value&#10;ANOTHER_KEY=another value&#10;# comments are ignored" style="width:100%;font:12.5px/1.5 var(--mono);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);resize:vertical"></textarea>
          <div class="row" style="margin-top:6px">
            <label for="bulkScope" class="muted">Apply to</label>
            <select id="bulkScope">${[...scopes].map(s => `<option value="${esc(s)}">${esc(label(s))}</option>`).join('')}</select>
            <button class="btn primary" id="bulkSave">Import all</button>
          </div>
          <div id="bulkOut"></div>
        </div>
      </details>
    </div>` : '<p class="muted" style="padding:12px 18px">Read-only access. Ask a project maintainer to change runtime variables.</p>'}
    ${!Object.keys(j.files).length ? '<div class="empty">No server-side variables for this app yet.</div>' : ''}
    ${Object.entries(j.files).map(([scope, kv]) => `
      <div style="padding:12px 18px;border-bottom:1px solid var(--line)">
        <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px">${esc(label(scope))} <span class="mono" style="text-transform:none">(${esc(scope)}.env)</span></div>
        <table class="kv">${kv.map(x => `<tr><td>${esc(x.key)}</td><td class="mono">${esc(x.value)}</td>
          ${j.can_manage ? `<td style="text-align:right;white-space:nowrap">
            <button class="btn" data-edit="${esc(scope)}|${esc(x.key)}" style="font-size:12px">Edit</button>
            <button class="btn danger" data-del="${esc(scope)}|${esc(x.key)}" style="font-size:12px;margin-left:4px">Delete</button>
          </td>` : ''}</tr>`).join('') || '<tr><td class="muted">empty</td></tr>'}</table>
      </div>`).join('')}`;
  if (!j.can_manage) return;

  const affectedFor = scope => {
    const base = scope.split('.')[0];
    return envs.filter(d => base === 'common' || d.ENV_NAME === base || envClass(d.ENV_NAME) === base);
  };
  const showAffected = () => {
    const sc = $('#nScope').value, list = affectedFor(sc);
    $('#affected').innerHTML = list.length
      ? list.map(d => `<button class="btn" data-redeploy="${esc(d.ENV_NAME)}" style="font-size:12px">${esc(d.ENV_NAME)}</button>`).join(' ')
      : '<span>none deployed yet</span>';
    $('#affected').querySelectorAll('[data-redeploy]').forEach(b => b.onclick = async () => {
      b.disabled = true; toast(`Redeploying ${app}/${b.dataset.redeploy}…`, 60000);
      try { const r = await api('/api/action', { app, env: b.dataset.redeploy, action: 'redeploy' }); toast(r.ok ? `${b.dataset.redeploy} redeployed ✓` : `${b.dataset.redeploy} failed`); await load(); }
      catch (e) { toast(e.message); } finally { b.disabled = false; }
    });
  };
  $('#nScope').onchange = showAffected; showAffected();
  $('#nSave').onclick = async () => {
    const scope = $('#nScope').value + $('#nComp').value, key = $('#nKey').value.trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return toast('Key must look like MY_KEY');
    try { await api('/api/secret', { app, scope, key, value: $('#nVal').value }); toast(`${key} saved — redeploy to apply`); $('#nKey').value = $('#nVal').value = ''; renderVarsFor(app); }
    catch (e) { toast(e.message); }
  };
  $('#bulkSave', el)?.addEventListener('click', async () => {
    const raw = $('#bulkEnv', el).value, scope = $('#bulkScope', el).value;
    const pairs = raw.split('\n').flatMap(line => {
      line = line.trim();
      if (!line || line.startsWith('#')) return [];
      const eq = line.indexOf('=');
      if (eq < 1) return [];
      let key = line.slice(0, eq).trim().replace(/^export\s+/, '');
      let val = line.slice(eq + 1).trim().replace(/^['"]|['"]$/g, '');
      return /^[A-Za-z_][A-Za-z0-9_]*$/.test(key) ? [{ key, value: val }] : [];
    });
    if (!pairs.length) return toast('No valid KEY=value lines found');
    try {
      const r = await api('/api/secrets/bulk', { app, scope, pairs });
      $('#bulkOut', el).innerHTML = `<pre>Saved: ${esc(r.saved.join(', ') || 'none')}</pre>`;
      toast(`${r.saved.length} variable(s) saved — redeploy to apply`);
      $('#bulkEnv', el).value = '';
      renderVarsFor(app);
    } catch (e) { toast(e.message); }
  });
  $('#varBody').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const [scope, key] = b.dataset.del.split('|');
    if (!window.confirm(`Delete ${key} from ${scope}?`)) return;
    await api('/api/secret', { app, scope, key, value: null }); toast(`${key} deleted`); renderVarsFor(app);
  });
  $('#varBody').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const [scope, key] = b.dataset.edit.split('|'), [base, comp] = scope.split('.');
    $('#nScope').value = base; $('#nComp').value = comp ? '.' + comp : ''; $('#nKey').value = key;
    $('#nVal').value = ''; $('#nVal').placeholder = 'new value (current is hidden)'; $('#nVal').focus(); showAffected();
  });
}

          ? `<div class="banner" style="margin-top:12px"><b>Invitation created, but the account could not be created:</b> ${esc(acct.error)}. A platform administrator can create it in Keycloak; the invitation stays pending.</div>`
          : `<div class="banner" style="margin-top:12px;background:var(--ok-soft)"><b>Invitation created.</b> They will see it in the console after signing in${acct.delivery === 'email' ? ' (an email to set up their account was sent)' : ''}.</div>`;

  el.querySelectorAll('[data-memberremove]').forEach(b => b.onclick = () => {

    postAccess({ op: 'member', organization, email, role: 'none' });
  });
  $('#grantSave', el)?.addEventListener('click', () =>
    postAccess({ op: 'project-grant', app: $('#grantProject', el).value,
      uid: $('#grantUser', el).value, role: $('#grantRole', el).value }));

  // environment / class / branch grants
  const egHints = () => {
    const app = $('#egProject', el)?.value, kind = $('#egKind', el)?.value;
    const envs = STATE.deployments.filter(d => d.APP === app);
    const options = kind === 'env' ? envs.map(d => d.ENV_NAME)
      : kind === 'class' ? ['prod', 'staging', 'develop', 'preview']
      : [...new Set(envs.map(d => d.BRANCH).filter(Boolean))];
    $('#egSuggest', el).innerHTML = options.map(o => `<option value="${esc(o)}">`).join('');
    $('#egValue', el).placeholder = kind === 'env' ? 'develop or pr-12' : kind === 'class' ? 'preview' : 'feature/checkout* (* = anything)';
  };
  $('#egProject', el)?.addEventListener('change', egHints);
  $('#egKind', el)?.addEventListener('change', egHints);
  egHints();
  $('#egSave', el)?.addEventListener('click', () => {
    const value = $('#egValue', el).value.trim();
    if (!value) return toast('Enter the environment, class or branch pattern');
    postAccess({ op: 'environment-grant', app: $('#egProject', el).value, uid: $('#egUser', el).value,
      scope: `${$('#egKind', el).value}:${value}`, role: $('#egRole', el).value });
  });
  el.querySelectorAll('[data-egrevoke]').forEach(btn => btn.onclick = () => {
    const [app, uid, scope] = btn.dataset.egrevoke.split('|');
    postAccess({ op: 'environment-grant', app, uid, scope, role: 'none' });
  });
}
