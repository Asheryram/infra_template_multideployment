          : `<button class="btn primary" id="gitopsStart">▶ Start watcher</button>
             every <input id="gitopsInterval" type="number" value="30" min="10" max="300" style="width:70px"> seconds`}
        <button class="btn" id="gitopsLogs">View logs</button>
      </div>
      <div id="gitopsOut" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Add a Project</h2></div>
    <div style="padding:16px 18px">
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">Lets a repo deploy to this server through signed webhooks. The app name must equal <span class="mono">name</span> in the repo's <span class="mono">.infradeploy/infra.yml</span>.</p>
      <div class="row">
        <input id="pApp" placeholder="app name, e.g. shop-api" class="mono" style="width:200px">
        <input id="pRepo" placeholder="owner/repo" class="mono" style="width:280px">
      </div>
      <div class="row" style="margin-top:4px">Allowed environments:
        ${ALL_ENVS.map(e => `<label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" class="pEnv" value="${e}" checked> ${e}</label>`).join(' ')}
        &nbsp; prod from branch <input id="pProdBranch" value="main" class="mono" style="width:90px">
      </div>
      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12.5px">Private repo or images? Tokens (optional)</summary>
        <div class="row" style="margin-top:8px">
          <input id="pGhToken" placeholder="GitHub token (private repo)" type="password" style="width:280px">
        </div>
        <div class="row">
          <input id="pRegUser" placeholder="registry user (private images)" style="width:200px">
          <input id="pRegToken" placeholder="registry read token" type="password" style="width:280px">
        </div></details>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="pAdd">Add project</button></div>
      <div id="pOut"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Registered Projects</h2><span class="card-meta">${j.projects.length} total</span></div>
    <div class="scroll"><table>
      <tr><th>Project</th><th>Repo</th><th>Allowed Envs</th><th>Running Envs</th><th>Registry</th><th>Added</th><th></th></tr>
      ${j.projects.map(p => `<tr>
        <td class="mono"><b>${esc(p.app)}</b></td>
        <td class="mono" style="color:var(--muted)">${esc(p.repo)}</td>
        <td>${p.envs.split(',').map(e => envBadge(e === 'preview' ? 'pr-…' : e).replace('pr-…', 'preview')).join(' ')}<br><span class="muted" style="font-size:12px">prod from <span class="mono">${esc(p.prod_branch)}</span></span></td>
        <td>${p.environments.length ? p.environments.map(envBadge).join(' ') : '<span class="muted">none yet</span>'}</td>
        <td style="font-size:12.5px">${p.has_registry_token ? `<span style="color:var(--ok)">✓</span> ${esc(p.registry_user)}` : '<span class="muted">public</span>'}
          ${p.has_gh_token ? '<span style="color:var(--ok);margin-left:6px">✓ gh-token</span>' : ''}</td>
        <td style="white-space:nowrap;font-size:12.5px">${ago(p.created_at)}<br><span class="muted">${esc(p.created_by)}</span></td>
        <td style="white-space:nowrap">
          <button class="btn" data-penvs="${esc(p.app)}|${esc(p.envs)}" style="font-size:12px">Envs…</button>
          <button class="btn" data-prot="${esc(p.app)}|${esc(p.repo)}" style="font-size:12px">Rotate</button>
          <button class="btn danger" data-prm="${esc(p.app)}" style="font-size:12px">Remove</button>
        </td></tr>`).join('') || '<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}
    </table></div>
  </div>`;

  el.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Copied ✓')));
  $('#doneSecret', el)?.addEventListener('click', () => renderProjects());

  const gitopsOut = $('#gitopsOut', el);
  const gitopsAction = async (op, interval) => {
    const btn = op === 'start' ? $('#gitopsStart', el) : op === 'stop' ? $('#gitopsStop', el) : $('#gitopsLogs', el);
    if (btn) btn.disabled = true;
    try {
      const r = await api('/api/gitops', { op, interval });
      gitopsOut.innerHTML = `<pre>${esc(r.output || '')}</pre>`;
      if (op !== 'logs') renderProjects();
    } catch (e) { toast(e.message); }
    finally { if (btn) btn.disabled = false; }
  };
  $('#gitopsStart', el)?.addEventListener('click', () =>
    gitopsAction('start', parseInt($('#gitopsInterval', el)?.value || 30)));
  $('#gitopsStop', el)?.addEventListener('click', () => gitopsAction('stop'));
  $('#gitopsLogs', el)?.addEventListener('click', () => gitopsAction('logs'));
  $('#pAdd', el).onclick = async e => {
    const app = $('#pApp').value.trim(), repo = $('#pRepo').value.trim();
    const envs = [...el.querySelectorAll('.pEnv:checked')].map(c => c.value).join(',');
    if (!/^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$/.test(app)) return toast('App name: lowercase letters, digits, dashes');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('Repo must look like owner/repo');
    if (!envs) return toast('Allow at least one environment');
    e.target.disabled = true;
    try {
      const r = await api('/api/project', { op: 'add', app, repo, envs, prod_branch: $('#pProdBranch').value.trim(),
        gh_token: $('#pGhToken').value.trim(),
        registry_user: $('#pRegUser').value.trim(), registry_token: $('#pRegToken').value.trim() });
      if (!r.ok || !r.secret) { $('#pOut').innerHTML = `<pre>${esc(r.output)}</pre>`; return; }
      renderProjects({ app, repo, secret: r.secret });
    } catch (err) { toast(err.message); } finally { e.target.disabled = false; }
  };
  el.querySelectorAll('[data-prot]').forEach(b => b.onclick = async () => {
    const [app, repo] = b.dataset.prot.split('|');
    if (!window.confirm(`Issue a new webhook secret for ${app}? The current one stops working immediately.`)) return;
    const r = await api('/api/project', { op: 'rotate', app });
    if (r.secret) renderProjects({ app, repo, secret: r.secret }); else toast('Failed — see Activity');
  });
  el.querySelectorAll('[data-penvs]').forEach(b => b.onclick = async () => {
    const [app, envs] = b.dataset.penvs.split('|');
    const v = prompt(`Allowed environments for ${app} (comma separated: ${ALL_ENVS.join(', ')})`, envs);
    if (v === null) return;
    const r = await api('/api/project', { op: 'set', app, envs: v.replace(/\s+/g, '') }).catch(e => ({ output: e.message }));
    toast(r.ok ? `${app} updated` : (r.output || 'Failed')); renderProjects();
  });
  el.querySelectorAll('[data-prm]').forEach(b => b.onclick = async () => {
    const app = b.dataset.prm;
    const c = prompt(`Remove ${app}? Running environments stay until you destroy them.\nType ${app} to confirm:`);
    if (c !== app) return toast('Not confirmed');
    const r = await api('/api/project', { op: 'remove', app, confirm: c });
    toast(r.ok ? `${app} removed` : 'Failed'); renderProjects();
  });
}

// ── Activity tab ──────────────────────────────────────────────────────────────
async function renderActivity() {
  const j = await api('/api/activity');
  $('#tab-activity').innerHTML = `<div class="card">
    <div class="card-header"><h2>Recent Activity</h2><span class="card-meta">console actions + deploys</span></div>
    <div style="padding:16px 18px"><pre style="max-height:600px">${esc(j.lines.join('') || 'Nothing yet.')}</pre></div>
  </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
load().catch(e => { $('#tab-envs').innerHTML = `<div class="card"><div class="empty">Could not load: ${esc(e.message)}</div></div>`; });
setInterval(() => { if (!document.hidden && !current) load().catch(() => {}); }, 15000);
</script>
</body>
</html>
