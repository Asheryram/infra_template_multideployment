<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infra Console</title>
<style>
:root {
  --bg: #f0f2f5;
  --sidebar: #0f1623;
  --sidebar-hover: #1a2235;
  --sidebar-active: #1e3a5f;
  --panel: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --ok: #16a34a;
  --warn: #d97706;
  --bad: #dc2626;
  --prod: #991b1b;
  --staging: #92400e;
  --develop: #1d4ed8;
  --preview: #6d28d9;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0d14; --panel: #111827; --text: #f3f4f6; --muted: #9ca3af;
    --line: #1f2937; --accent: #3b82f6; --accent-soft: #1e3a5f;
    --sidebar: #080b12; --sidebar-hover: #111827; --sidebar-active: #1e3a5f;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; min-height: 100vh; }

/* ── Sidebar ── */
#sidebar {
  width: 220px; min-height: 100vh; background: var(--sidebar); color: #e2e8f0;
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
}
#sidebar .brand {
  display: flex; align-items: center; gap: 10px; padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
#sidebar .brand svg { flex-shrink: 0; }
#sidebar .brand-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
#sidebar .brand-sub { font-size: 11px; color: #64748b; margin-top: 1px; }
#sidebar nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
#sidebar nav button {
  width: 100%; text-align: left; border: 0; background: none; color: #94a3b8;
  padding: 9px 12px; border-radius: 6px; font: inherit; font-size: 13.5px; cursor: pointer;
  display: flex; align-items: center; gap: 10px; transition: background .15s, color .15s;
}
#sidebar nav button:hover { background: var(--sidebar-hover); color: #e2e8f0; }
#sidebar nav button.on { background: var(--sidebar-active); color: #fff; font-weight: 600; }
#sidebar nav button svg { opacity: .7; flex-shrink: 0; }
#sidebar nav button.on svg { opacity: 1; }
#sidebar .sidebar-footer {
  padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07);
  font-size: 12px; color: #475569;
}
#sidebar .sidebar-footer a { color: #64748b; text-decoration: none; }
#sidebar .sidebar-footer a:hover { color: #94a3b8; }

/* ── Main ── */
#main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
#topbar {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow);
}
#topbar h1 { font-size: 15px; font-weight: 600; }
#topbar .meta { color: var(--muted); font-size: 13px; margin-left: 4px; }
#topbar .links { margin-left: auto; display: flex; gap: 8px; }
#topbar .links a {
  font-size: 12.5px; color: var(--muted); text-decoration: none; padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; gap: 5px;
  transition: border-color .15s, color .15s;
}
#topbar .links a:hover { border-color: var(--accent); color: var(--accent); }
#content { padding: 24px; max-width: 1280px; width: 100%; }

/* ── Stats row ── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow);
}
.stat-card .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.stat-card .stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; line-height: 1; }
.stat-card .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── Cards ── */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }
.card-header {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.card-header h2 { font-size: 14px; font-weight: 600; }
.card-header .card-meta { color: var(--muted); font-size: 13px; margin-left: auto; }

/* ── Table ── */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: rgba(0,0,0,.015); }
@media (prefers-color-scheme: dark) { tr:hover td { background: rgba(255,255,255,.02); } }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
}
.env-prod    { background: #fee2e2; color: var(--prod); }
.env-staging { background: #fef3c7; color: var(--staging); }
.env-develop { background: #dbeafe; color: var(--develop); }
.env-preview { background: #ede9fe; color: var(--preview); }
@media (prefers-color-scheme: dark) {
  .env-prod { background: #3b0a0a; } .env-staging { background: #3b2000; }
  .env-develop { background: #0f2040; } .env-preview { background: #2d1b5e; }
}
.badge-type { background: var(--accent-soft); color: var(--accent); }

/* ── Status dot ── */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.up { background: var(--ok); box-shadow: 0 0 0 2px rgba(22,163,74,.2); }
.down { background: var(--bad); box-shadow: 0 0 0 2px rgba(220,38,38,.2); }
.blocked { background: var(--warn); box-shadow: 0 0 0 2px rgba(217,119,6,.2); }

/* ── Chips ── */
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--warn); color: var(--warn); margin-left: 5px; font-weight: 500; }

/* ── Buttons ── */
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 6px 13px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
  transition: border-color .15s, background .15s; white-space: nowrap;
}
button.btn:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.danger:hover { background: #fee2e2; }
button:disabled { opacity: .45; cursor: wait; }
input, select {
  font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--text);
  transition: border-color .15s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

/* ── Misc ── */
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 10px 0; }
.resource-card { border: 1px solid var(--line); border-radius: 7px; padding: 12px; }
.resource-card h4 { font-size: 13px; text-transform: capitalize; margin-bottom: 8px; }
.resource-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.resource-fields label { display: grid; gap: 4px; color: var(--muted); font-size: 11.5px; }
.resource-fields input { width: 100%; font-family: var(--mono); }
.resource-effective { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
.empty { padding: 32px; color: var(--muted); text-align: center; font-size: 13.5px; }
pre {
  background: #0d1117; color: #c9d1d9; padding: 14px 16px; border-radius: var(--radius);
  overflow: auto; max-height: 440px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
}
.banner {
  background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
  padding: 11px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.5;
}
@media (prefers-color-scheme: dark) { .banner { background: #2a1f00; border-color: #78350f; color: #fbbf24; } }

/* ── Drawer ── */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw);
  background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -8px 0 32px rgba(0,0,0,.12); z-index: 30;
  overflow-y: auto; transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.drawer.open { transform: none; }
.drawer-header {
  display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: var(--panel); z-index: 1;
}
.drawer-header h2 { font-size: 15px; font-weight: 600; }
.drawer-header .close-btn { margin-left: auto; }
.drawer section { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer h3 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.kv td:first-child { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; color: var(--muted); width: 1%; padding-right: 20px; }
.env-vars-help { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.env-vars-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.env-vars-head, .env-var-row {
  display: grid; grid-template-columns: minmax(105px, .8fr) minmax(145px, 1.5fr) minmax(130px, 1fr) auto;
  align-items: center; gap: 12px; padding: 10px 12px;
}
.env-vars-head { background: var(--bg); color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.env-var-row { border-top: 1px solid var(--line); min-width: 0; }
.env-var-row.pending { background: var(--accent-soft); }
.env-var-key { min-width: 0; font: 12px/1.45 var(--mono); color: var(--text); overflow-wrap: anywhere; }
.env-var-value { display: flex; align-items: center; gap: 6px; min-width: 0; font: 12px/1.45 var(--mono); overflow-wrap: anywhere; }
.env-var-value [data-val] { min-width: 0; overflow-wrap: anywhere; }
.env-var-source { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-width: 0; }
.source-badge, .pending-badge, .managed-badge {
  display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line); color: var(--muted);
  font-size: 10.5px; font-weight: 600; line-height: 1.4; white-space: nowrap;
}
.source-badge.repo { color: var(--develop); border-color: var(--develop); }
.source-badge.console { color: var(--preview); border-color: var(--preview); }
.source-badge.platform, .managed-badge { color: var(--muted); }
.pending-badge { color: var(--warn); border-color: var(--warn); background: transparent; }
.env-var-scope { width: 100%; color: var(--muted); font-size: 10.5px; overflow-wrap: anywhere; }
.env-var-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 5px; }
.env-var-actions .btn { font-size: 11.5px; }
.env-var-form { padding: 12px; margin-top: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.env-var-form-title { font-size: 12px; font-weight: 650; margin-bottom: 8px; }
.env-var-form .row { margin: 6px 0 0; }
.env-var-form input { min-width: 0; }
@media (max-width: 700px) {
  .env-vars-head { display: none; }
  .env-var-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; padding: 12px; }
  .env-var-key { grid-column: 1; }
  .env-var-value { grid-column: 2; }
  .env-var-source { grid-column: 1; }
  .env-var-actions { grid-column: 2; }
  .env-var-form .row > * { flex: 1 1 100%; width: 100% !important; }
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1f2937; color: #f9fafb; padding: 11px 20px; border-radius: 8px;
  z-index: 50; display: none; max-width: 90vw; font-size: 13.5px;
  box-shadow: var(--shadow-md);
}

/* ── Overlay ── */
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
#overlay.on { display: block; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="7" fill="#2563eb"/>
      <path d="M7 14h14M14 7v14M9 9l10 10M19 9L9 19" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-name">Infra Console</div>
      <div class="brand-sub" id="sidebarDomain">loading…</div>
    </div>
  </div>
  <nav>
    <button data-tab="envs" class="on">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
      Environments
    </button>
    <button data-tab="projects">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M2 4a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6M5 5.5h6M5 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Projects
    </button>
    <button data-tab="vars">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Variables
    </button>
    <button data-tab="activity">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M8 2v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/></svg>
      Activity
    </button>
    <button data-tab="access" hidden>
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 14v-1.5A3.5 3.5 0 015 9h2a3.5 3.5 0 013.5 3.5V14M11 3.5a2 2 0 010 4M12 9.5a3 3 0 012.5 3V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Access
    </button>
  </nav>
  <div class="sidebar-footer">
    <div id="sidebarUser" style="margin-bottom:6px;color:#64748b"></div>
    <div id="sidebarLinks" style="display:flex;flex-direction:column;gap:4px"></div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="topTitle">Environments</h1>
    <span class="meta" id="topMeta"></span>
    <div class="links" id="topLinks"></div>
  </div>
  <div id="content">
    <div id="tab-envs"></div>
    <div id="tab-projects" hidden></div>
    <div id="tab-vars" hidden></div>
    <div id="tab-activity" hidden></div>
    <div id="tab-access" hidden></div>
  </div>
</div>

<div id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STATE = { deployments: [], settings: {} };
let current = null;
let lastOut = { key: '', html: '' };

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Infra-Console': '1' }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}
function ago(ts) {
  if (!ts) return '';
  const s = Date.now() / 1000 - Number(ts);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
function envClass(env) { return env.startsWith('pr-') ? 'preview' : env; }
function envBadge(env) {
  const c = envClass(env);
  const cls = ['prod','staging','develop','preview'].includes(c) ? c : 'develop';
  return `<span class="badge env-${cls}">${esc(env)}</span>`;
}
function hostLink(url) {
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\//, ''))}</a>` : '<span class="muted">—</span>';
}
function byApp() { const m = {}; for (const d of STATE.deployments) (m[d.APP] ||= []).push(d); return m; }
const ORDER = { prod: 0, staging: 1, develop: 2 };
const sortEnvs = list => list.sort((a, b) => (ORDER[a.ENV_NAME] ?? 3) - (ORDER[b.ENV_NAME] ?? 3) || a.ENV_NAME.localeCompare(b.ENV_NAME, undefined, { numeric: true }));
const CONNECTED_LABEL = c => c === 'own' ? 'its own database' : c?.startsWith('platform:') ? `platform DB ${c.slice(9)}` : c?.startsWith('external:') ? `external on ${c.slice(9)}` : 'none';

const TAB_TITLES = { envs: 'Environments', projects: 'Projects', vars: 'Variables', activity: 'Activity', access: 'Organizations & access' };

async function load() {
  STATE = await api('/api/state');
  const s = STATE.settings;
  const base = d => `https://${d}.${s.domain}${s.suffix}`;
  $('#sidebarDomain').textContent = s.domain || s.server;
  $('#sidebarUser').textContent = '👤 ' + (STATE.user || 'unknown');
  const platformAdmin = STATE.access?.platform_admin;
  const orgAdmin = STATE.access?.organizations?.some(org => org.role === 'org_admin');
  const canManageVars = platformAdmin || Object.values(STATE.access?.project_roles || {}).includes('maintainer');
  document.querySelector('#sidebar nav button[data-tab=projects]').hidden = !platformAdmin;
  document.querySelector('#sidebar nav button[data-tab=activity]').hidden = !platformAdmin;
  document.querySelector('#sidebar nav button[data-tab=access]').hidden =
    !['authentik', 'keycloak'].includes(STATE.access?.auth_mode) || (!platformAdmin && !orgAdmin);
  document.querySelector('#sidebar nav button[data-tab=vars]').hidden = !canManageVars;
  const links = platformAdmin
    ? [['Traefik', base('traefik')], ['Logs', base('logs')], ['Status', base('status')]]
    : [['Status', base('status')]];
  $('#sidebarLinks').innerHTML = links
    .map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('');
  $('#topMeta').textContent = s.server;
  $('#topLinks').innerHTML = (platformAdmin
    ? [['Traefik', base('traefik')], ['Container logs', base('logs')], ['Uptime', base('status')]]
    : [['Uptime', base('status')]])
    .map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener"><svg width="12" height="12" fill="none" viewBox="0 0 12 12"><path d="M2 10L10 2M10 2H5M10 2v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>${n}</a>`).join('');
  if (STATE.access?.auth_mode === 'keycloak') {
    $('#topLinks').innerHTML += '<a href="/oauth2/sign_out?rd=%2Fsigned-out">Sign out</a>';
  }
  renderEnvs();
  if (!$('#tab-vars').hidden) renderVars();
  if (current) openDrawer(current.app, current.env, true);
}

// ── Environments tab ──────────────────────────────────────────────────────────
function renderEnvs() {
  const apps = byApp(), names = Object.keys(apps).sort();
  const total = STATE.deployments.length;
  const up = STATE.deployments.filter(d => d.STATE === 'up').length;
  const previews = STATE.deployments.filter(d => d.ENV_NAME.startsWith('pr-')).length;
  const blocked = STATE.deployments.filter(d => d.STATE === 'blocked').length;

  if (!names.length) {
    const hasTenantIdentity = ['authentik', 'keycloak'].includes(STATE.access?.auth_mode) && !STATE.access?.platform_admin;
    const message = hasTenantIdentity
      ? 'No projects are assigned to your account yet. Ask your organization administrator to grant you a project role.'
      : 'Nothing deployed yet. Open a PR in an app repo, or run <span class="mono">infra deploy</span>.';
    $('#tab-envs').innerHTML = `<div class="card"><div class="empty">${message}</div></div>`;
    return;
  }

  const stats = `
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Total Environments</div><div class="stat-value">${total}</div><div class="stat-sub">${names.length} app${names.length !== 1 ? 's' : ''}</div></div>
      <div class="stat-card"><div class="stat-label">Running</div><div class="stat-value" style="color:var(--ok)">${up}</div><div class="stat-sub">${total - up} down</div></div>
      <div class="stat-card"><div class="stat-label">Previews</div><div class="stat-value" style="color:var(--preview)">${previews}</div><div class="stat-sub">of ${esc(STATE.settings.max_previews)} max</div></div>
      <div class="stat-card"><div class="stat-label">Blocked</div><div class="stat-value" style="color:${blocked ? 'var(--bad)' : 'var(--ok)'}">${blocked}</div><div class="stat-sub">${blocked ? 'missing secrets' : 'all clear'}</div></div>
    </div>`;

  const tables = names.map(app => {
    const rows = sortEnvs(apps[app]);
    return `<div class="card">
      <div class="card-header">
        <h2>${esc(app)}</h2>
        <span class="badge badge-type">${esc(rows[0].TYPE || 'unknown')}</span>
        <span class="card-meta">${rows.length} environment${rows.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="scroll"><table>
        <tr><th>Status</th><th>Environment</th><th>URL</th><th>Branch / Tag</th><th>Database</th><th>Deployed</th><th></th></tr>
        ${rows.map(d => {
          const chips = [
            d.STATE === 'blocked' ? '<span class="chip">blocked</span>' : '',
            d.MISSING?.length && d.STATE !== 'blocked' ? `<span class="chip">${d.MISSING.length} missing</span>` : '',
            d.UPCOMING_MISSING?.length ? `<span class="chip" title="required by newer branch: ${esc(d.UPCOMING_MISSING.join(', '))}">will miss ${d.UPCOMING_MISSING.length}</span>` : '',
          ].join('');
          return `<tr>
            <td><span class="dot ${d.STATE}"></span></td>
            <td>${envBadge(d.ENV_NAME)}${chips}</td>
            <td>${hostLink(d.URL)}${d.API_URL && d.API_URL !== d.URL ? '<br>' + hostLink(d.API_URL) : ''}</td>
            <td class="mono">${esc(d.BRANCH || '—')}<br><span class="muted">${esc(d.TAG || '')}</span></td>
            <td>${d.HAS_OWN_DB ? '<span style="color:var(--ok)">provisioned</span>' : d.DB_WIPED ? '<span class="chip">wiped</span>' : '<span class="muted">—</span>'}</td>
            <td style="white-space:nowrap">${ago(d.DEPLOYED_AT || d.BLOCKED_AT)}<br><span class="muted">${esc(d.DEPLOYED_BY || '')}</span></td>
            <td><button class="btn" data-manage="${esc(d.APP)}|${esc(d.ENV_NAME)}">Manage →</button></td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }).join('');

  $('#tab-envs').innerHTML = stats + tables;
}

document.addEventListener('click', e => {
  const m = e.target.closest('[data-manage]');
  if (m) { const [a, en] = m.dataset.manage.split('|'); openDrawer(a, en); }
  const t = e.target.closest('#sidebar nav button');
  if (t) {
    document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.toggle('on', b === t));
    for (const id of ['envs', 'projects', 'vars', 'activity', 'access']) $('#tab-' + id).hidden = id !== t.dataset.tab;
    $('#topTitle').textContent = TAB_TITLES[t.dataset.tab] || '';
    if (t.dataset.tab === 'vars') renderVars();
    if (t.dataset.tab === 'activity') renderActivity();
    if (t.dataset.tab === 'projects') renderProjects();
    if (t.dataset.tab === 'access') renderAccess();
  }
});

// ── Drawer ────────────────────────────────────────────────────────────────────
async function openDrawer(app, env, refresh) {
  current = { app, env };
  const d = STATE.deployments.find(x => x.APP === app && x.ENV_NAME === env);
  if (!d) { closeDrawer(); return; }
  const dr = $('#drawer'), isPreview = env.startsWith('pr-');
  const platformAdmin = STATE.access?.platform_admin;
  const canOperate = platformAdmin || ['operator', 'maintainer'].includes(d.ROLE);
  const dbSources = STATE.deployments.filter(x => x.HAS_OWN_DB);

  dr.innerHTML = `
  <div class="drawer-header">
    <h2>${esc(app)}</h2>${envBadge(env)}
    <span class="muted" style="font-size:13px">${esc(d.TYPE || '')}</span>
    <span class="badge">${esc(d.ROLE || 'platform admin')}</span>
    <button class="btn close-btn" id="drawerClose">✕ Close</button>
  </div>
  ${d.MISSING?.length ? `<section><div class="banner"><b>${d.STATE === 'blocked' ? 'Deploy blocked' : 'Required variables missing'}:</b>
    <span class="mono"> ${d.MISSING.map(esc).join(', ')}</span><br>
    Add them under <a href="#" id="goVars">Variables → ${esc(app)}</a>, then
    ${canOperate ? '<button class="btn primary" data-act="redeploy" style="margin-top:6px">Retry deploy</button>' : ''}</div></section>` : ''}
  <section>
    <h3>Open</h3>
    <div style="margin-bottom:6px">App: ${hostLink(d.URL)}</div>
    ${d.API_URL && d.API_URL !== d.URL ? `<div style="margin-bottom:6px">API: ${hostLink(d.API_URL)}</div>` : ''}
    <div class="muted" style="font-size:12.5px">Branch <span class="mono">${esc(d.BRANCH || '—')}</span> · tag <span class="mono">${esc(d.TAG || '')}</span>${d.PREV_TAG ? ` · prev <span class="mono">${esc(d.PREV_TAG)}</span>` : ''} · commit <span class="mono">${esc((d.COMMIT || '').slice(0, 10))}</span></div>
    ${isPreview ? '<div class="muted" style="margin-top:6px;font-size:12.5px">Preview login: use the preview basic-auth credentials from the inventory.</div>' : ''}
  </section>
  <section><h3>Database</h3><div id="dbBox" class="muted">loading…</div></section>
  <section><h3>Container Resources</h3><div id="resourcesBox" class="muted">loading…</div></section>
  <section><h3>Environment Variables</h3><div id="varsBox" class="muted">loading…</div></section>
  <section>
    <h3>Actions</h3>
    <div class="row">
      ${canOperate ? '<button class="btn primary" data-act="redeploy">↺ Redeploy</button><button class="btn" data-act="restart">⟳ Restart</button>' : ''}
      ${canOperate && d.PREV_TAG ? `<button class="btn" data-act="rollback">⬅ Roll back to ${esc(d.PREV_TAG)}</button>` : ''}
      ${platformAdmin ? '<button class="btn danger" data-act="destroy">✕ Destroy…</button>' : ''}
      ${!canOperate && !platformAdmin ? '<span class="muted">Read-only project access</span>' : ''}
    </div>
  </section>
  <section>
    <h3>Logs <button class="btn" id="loadLogs" style="margin-left:8px;font-size:12px">Load last 200 lines</button></h3>
    <div id="logOut" style="margin-top:8px"></div>
  </section>
  <section>
    <h3>Output</h3>
    <div id="out" class="muted" style="font-size:13px">${lastOut.key === app + '/' + env ? lastOut.html : 'Results of actions appear here.'}</div>
  </section>`;

  dr.classList.add('open');
  $('#overlay').classList.add('on');

  $('#drawerClose', dr).onclick = closeDrawer;
  $('#overlay').onclick = closeDrawer;
  $('#goVars', dr)?.addEventListener('click', e => {
    e.preventDefault(); closeDrawer();
    document.querySelector('#sidebar nav button[data-tab=vars]').click();
    $('#varApp').value = app; renderVarsFor(app);
  });
  dr.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b, app, env, b.dataset.act));
  renderEnvVars(dr, app, env);
  renderDatabase(dr, app, env, dbSources);
  renderResources(dr, app, env);
  $('#loadLogs', dr).onclick = async e => {
    e.target.disabled = true;
    try { const j = await api(`/api/logs?app=${app}&env=${env}&n=200`); $('#logOut', dr).innerHTML = `<pre>${esc(j.output)}</pre>`; }

const PLATFORM_MANAGED_KEYS = new Set(['APP_NAME', 'APP_ENV', 'ENV_CLASS', 'IS_PREVIEW', 'PORT', 'PUBLIC_URL', 'INFRA_DOMAIN', 'IMAGE_TAG', 'GIT_BRANCH', 'GIT_COMMIT']);
const ORIGIN_LABEL = { platform: 'Platform managed', repo: 'Repository', console: 'Console override', deleted: 'Removed' };

async function renderResources(dr, app, env) {
  const box = $('#resourcesBox', dr);
  const data = await api(`/api/resources?app=${encodeURIComponent(app)}&env=${encodeURIComponent(env)}`)
    .catch(e => ({ error: e.message }));
  if (data.error) { box.textContent = data.error; return; }
  const defaults = data.defaults, scopes = data.scopes;
  const selected = box.querySelector('#resourceScope')?.value;
  const scope = scopes.includes(selected) ? selected : env;
  box.classList.remove('muted');
  box.innerHTML = `
    <p class="env-vars-help">Infra-owned CPU and memory caps; app manifests cannot set these. Use memory units such as <span class="mono">256m</span> or <span class="mono">1g</span> and CPU values such as <span class="mono">0.5</span>. Changes apply on the next deploy; per-container and per-stack ceilings are enforced.</p>
    ${data.can_manage ? `<div class="row">
      <label for="resourceScope">Override scope</label>
      <select id="resourceScope">${scopes.map(s => `<option value="${esc(s)}" ${scope === s ? 'selected' : ''}>${s === 'common' ? 'All environments' : s === 'preview' ? 'All previews' : `Only ${esc(s)}`}</option>`).join('')}</select>
      <span class="muted" style="font-size:12px">Container ceiling: ${esc(defaults.max_container_mem_limit)} / ${esc(defaults.max_container_cpus)} CPU · stack ceiling: ${esc(defaults.max_stack_mem_limit)} / ${esc(defaults.max_stack_cpus)} CPU</span>
    </div>` : `<p class="muted">Resource allocations are managed by the platform administrator.</p>`}
    <div class="resource-grid">${data.components.map(item => {
      const override = item.overrides[scope] || {};
      const mem = override.mem_limit || item.effective.mem_limit;
      const cpus = override.cpus || item.effective.cpus;
      return `<div class="resource-card" data-resource="${esc(item.component)}">
        <h4>${esc(item.component)}</h4>
        ${data.can_manage ? `<div class="resource-fields">
          <label>Memory limit<input data-resource-mem value="${esc(mem)}" aria-label="${esc(item.component)} memory limit"></label>
          <label>CPU limit<input data-resource-cpus value="${esc(cpus)}" inputmode="decimal" aria-label="${esc(item.component)} CPU limit"></label>
        </div>` : ''}
        <div class="resource-effective">Currently effective: <span class="mono">${esc(item.effective.mem_limit)} · ${esc(item.effective.cpus)} CPU</span></div>
        ${data.can_manage ? `<div class="row">
          <button class="btn primary" data-resource-save>Save override</button>
          <button class="btn" data-resource-reset ${override.mem_limit || override.cpus ? '' : 'disabled'}>Reset scope</button>
        </div>` : ''}
        <div data-resource-output></div>
      </div>`;
    }).join('')}</div>`;

  if (!data.can_manage) return;
  $('#resourceScope', box).onchange = () => renderResources(dr, app, env);
  box.querySelectorAll('[data-resource]').forEach(card => {
    const component = card.dataset.resource;
    const send = async (body, message) => {
      const button = card.querySelector('[data-resource-save]');
      button.disabled = true;
      try {
        await api('/api/resources', { app, env, component, scope, ...body });
        toast(message);
        await renderResources(dr, app, env);
      } catch (e) {
        card.querySelector('[data-resource-output]').innerHTML = `<div class="chip">${esc(e.message)}</div>`;
      } finally { button.disabled = false; }
    };
    card.querySelector('[data-resource-save]').onclick = () => {
      const mem_limit = card.querySelector('[data-resource-mem]').value.trim();
      const cpus = card.querySelector('[data-resource-cpus]').value.trim();
      send({ mem_limit, cpus }, `${component} resource policy saved — redeploy to apply`);
    };
    card.querySelector('[data-resource-reset]').onclick = () =>
      send({ reset: true }, `${component} ${scope} override removed`);
  });
}

async function renderDatabase(dr, app, env, dbSources) {
  const box = $('#dbBox', dr);
  const i = await api(`/api/database?app=${app}&env=${env}`).catch(e => ({ error: e.message }));
  if (i.error) { box.textContent = i.error; return; }
  const others = dbSources.filter(x => !(x.APP === app && x.ENV_NAME === env));
  box.classList.remove('muted');
  box.innerHTML = `
    <table class="kv">
      <tr><td>This env's DB</td><td>${i.exists ? `<b>${esc(i.name)}</b> · ${esc(i.size)}` : i.wiped ? '<span class="chip">wiped</span>' : '<span class="muted">none</span>'}</td></tr>
      ${i.url_masked ? `<tr><td>Connection URL</td><td class="mono">${esc(i.url_masked)}</td></tr>` : ''}
      <tr><td>App connected to</td><td>${esc(CONNECTED_LABEL(i.connected))}</td></tr>
    </table>
    <p class="muted" style="font-size:12.5px;margin:10px 0">The database is only <b>provisioned</b> — the app uses it only if you set its connection variable (whatever the app calls it) to this URL. Wiping removes it; the app keeps running until you recreate it.</p>
    <div class="row">
      ${i.can_manage && !i.exists ? `<button class="btn primary" id="dbCreate">${i.wiped ? 'Recreate (empty)' : 'Create database'}</button>` : ''}
      ${i.can_wipe && i.exists ? `<button class="btn danger" id="dbWipe">Wipe…</button>` : ''}
    </div>
    ${i.exists && i.can_manage ? `<div class="row" style="margin-top:4px">
      Copy URL into variable <input id="dbKey" placeholder="e.g. DB_URL, PG_DSN, DATABASE_URL" class="mono" style="flex:1;min-width:220px">
      <button class="btn primary" id="dbUseOwn">Set variable → this DB</button></div>` : ''}
    ${others.length && i.can_manage ? `<div class="row" style="margin-top:4px">or point at another env's DB
      <select id="dbFrom">${others.map(x => `<option value="${esc(x.APP)}/${esc(x.ENV_NAME)}">${esc(x.APP)} / ${esc(x.ENV_NAME)}</option>`).join('')}</select>
      as <input id="dbKey2" placeholder="variable name" class="mono" style="width:180px">
      <button class="btn" id="dbUseOther">Set variable</button></div>` : ''}
    <div id="dbOut"></div>`;

  const done = async (r, what) => {
    $('#dbOut', box).innerHTML = `<pre>${esc(r.output || r.error || '')}</pre>`;
    toast(r.ok ? what : 'Failed — see output');
    renderDatabase(dr, app, env, dbSources); renderEnvVars(dr, app, env);
  };
  $('#dbCreate', box)?.addEventListener('click', async () => done(await api('/api/dbop', { app, env, op: 'create' }), 'Database ready'));
  $('#dbUseOwn', box)?.addEventListener('click', async () => {
    const key = $('#dbKey', box).value.trim();
    if (!key) return toast('Enter the variable name your app uses for the DB connection');
    done(await api('/api/dbop', { app, env, op: 'use', from: `${app}/${env}`, key, scope: env }), `${key} set — redeploy to apply`);
  });
  $('#dbUseOther', box)?.addEventListener('click', async () => {
    const from = $('#dbFrom', box).value, key = ($('#dbKey2', box) || $('#dbKey', box)).value.trim();
    if (!key) return toast('Enter the variable name your app uses for the DB connection');
    let allow_prod = false;
    if (from.endsWith('/prod')) {
      if (!window.confirm(`Point ${app}/${env} at the PROD database ${from}?`)) return;
      allow_prod = true;
    }
    done(await api('/api/dbop', { app, env, op: 'use', from, key, scope: env, allow_prod }), `${key} → ${from} — redeploy to apply`);
  });
  $('#dbWipe', box)?.addEventListener('click', async () => {
    const c = prompt(`Wipe the database of ${app}/${env}? All data is deleted.\nType ${app}/${env} to confirm:`);
    if (c !== `${app}/${env}`) return toast('Not confirmed');
    done(await api('/api/dbop', { app, env, op: 'wipe', confirm: c }), 'Database wiped');
  });
}

async function renderEnvVars(dr, app, env) {
  const box = $('#varsBox', dr);
  const j = await api(`/api/vars?app=${app}&env=${env}`).catch(e => ({ error: e.message }));
  if (j.error) { box.textContent = j.error; return; }
  const comps = Object.keys(j.components);
  const isPr = env.startsWith('pr-'), cls = envClass(env);
  const scopeOpts = [
    [env, isPr ? `only ${env}` : env],
    ...(isPr ? [['preview', `all ${app} previews`]] : []),
    ['common', `all ${app} environments`],
  ];
  const pending = Object.values(j.components).flat().filter(v => v.pending).length;
  const sourceScope = v => v.origin === 'console'
    ? (v.scope === 'common' ? 'All environments' : v.scope)
    : v.origin === 'repo' ? v.scope : '';

  box.classList.remove('muted');
  box.innerHTML = `
    <p class="env-vars-help">Values and sources for this deployment. Platform-managed settings are read-only. Add or edit app overrides below; changes apply on the next deploy.</p>
    ${pending ? `<div class="banner" style="margin-bottom:10px">${pending} change(s) pending. <button class="btn primary" id="varsRedeploy" style="margin-left:8px">Redeploy now</button></div>` : ''}
    ${comps.map(c => `
      ${comps.length > 1 ? `<div style="font-weight:600;font-size:13px;margin:12px 0 6px">${esc(c)}</div>` : ''}
      <div class="env-vars-list" role="list" aria-label="${esc(c)} environment variables">
        <div class="env-vars-head" aria-hidden="true"><span>Variable</span><span>Configured value</span><span>Source</span><span>Actions</span></div>
        ${j.components[c].map(v => {
          const platformManaged = v.origin === 'platform' || PLATFORM_MANAGED_KEYS.has(v.key);
          const source = ORIGIN_LABEL[v.origin] || v.origin;
          const scope = sourceScope(v);
          return `<div class="env-var-row${v.pending ? ' pending' : ''}" role="listitem">
            <div class="env-var-key">${esc(v.key)}</div>
            <div class="env-var-value"><span data-val="${esc(c)}|${esc(v.key)}">${esc(v.value)}</span>
              ${v.sensitive && STATE.access?.platform_admin ? `<button class="btn" data-reveal="${esc(c)}|${esc(v.key)}" aria-label="Reveal ${esc(v.key)}">Show</button>` : ''}</div>
            <div class="env-var-source"><span class="source-badge ${esc(v.origin)}">${esc(source)}</span>
              ${scope ? `<span class="env-var-scope">${esc(scope)}</span>` : ''}
              ${v.pending ? '<span class="pending-badge">Pending deploy</span>' : ''}</div>
            <div class="env-var-actions">
              ${!v.editable ? '<span class="muted">Read only</span>' : platformManaged
                ? `<span class="managed-badge">Platform managed</span>
                   ${v.origin === 'console' ? `<button class="btn danger" data-vdel="${esc(v.scope)}|${esc(v.key)}">Remove override</button>` : ''}`
                : `<button class="btn" data-vedit="${esc(c)}|${esc(v.key)}|${esc(v.origin === 'console' ? v.scope : '')}">${v.origin === 'console' ? 'Edit override' : 'Add override'}</button>
                   ${v.origin === 'console' ? `<button class="btn danger" data-vdel="${esc(v.scope)}|${esc(v.key)}">Remove</button>` : ''}`}
            </div>
          </div>`;
        }).join('')}
      </div>`).join('')}
    <div class="env-var-form">
      <div class="env-var-form-title">Add an app override</div>
      <p class="env-vars-help">Overrides take precedence over repository values. Platform-managed settings cannot be changed.</p>
      <div class="row">
        <input id="vKey" placeholder="VARIABLE_NAME" aria-label="Variable name" class="mono" style="width:170px">
        <input id="vVal" placeholder="Value" aria-label="Variable value" class="mono" style="flex:1;min-width:160px">
      </div>
      <div class="row">
        <label for="vScope" class="muted">Apply to</label>
        <select id="vScope">${scopeOpts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
        ${comps.length > 1 ? `<select id="vComp" aria-label="Component"><option value="">All components</option>${comps.map(c => `<option value=".${esc(c)}">${esc(c)} only</option>`).join('')}</select>` : ''}
        <button class="btn" id="vSave">Save</button>
        <button class="btn primary" id="vSaveDeploy">Save &amp; redeploy</button>
      </div>
    </div>`;

  const save = async redeploy => {
    const key = $('#vKey', box).value.trim(), value = $('#vVal', box).value;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return toast('Key must look like MY_KEY');
    if (PLATFORM_MANAGED_KEYS.has(key)) return toast(`${key} is managed by the platform and cannot be overridden`);
    const scope = $('#vScope', box).value + ($('#vComp', box)?.value || '');
    try {
      await api('/api/secret', { app, scope, key, value });
      toast(`${key} saved for ${scope}`);
      if (redeploy) return act($('#vSaveDeploy', box), app, env, 'redeploy');
      renderEnvVars(dr, app, env);
    } catch (e) { toast(e.message); }
  };
  $('#vSave', box).onclick = () => save(false);
  $('#vSaveDeploy', box).onclick = () => save(true);
  $('#varsRedeploy', box)?.addEventListener('click', e => act(e.target, app, env, 'redeploy'));
  box.querySelectorAll('[data-vedit]').forEach(b => b.onclick = () => {
    const [c, key, scope] = b.dataset.vedit.split('|');
    $('#vKey', box).value = key; $('#vVal', box).value = ''; $('#vVal', box).placeholder = `new value for ${key}`;
    if (scope) { const [base, part] = scope.split('.'); $('#vScope', box).value = base; if ($('#vComp', box)) $('#vComp', box).value = part ? '.' + part : ''; }
    else { $('#vScope', box).value = env; if ($('#vComp', box) && comps.length > 1) $('#vComp', box).value = '.' + c; }
    $('#vVal', box).focus();
    $('#vKey', box).scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  box.querySelectorAll('[data-vdel]').forEach(b => b.onclick = async () => {
    const [scope, key] = b.dataset.vdel.split('|');
    if (!window.confirm(`Delete ${key} (${scope === 'common' ? 'all environments' : scope})?`)) return;
    await api('/api/secret', { app, scope, key, value: null }); toast(`${key} deleted`); renderEnvVars(dr, app, env);
  });
  box.querySelectorAll('[data-reveal]').forEach(b => b.onclick = async () => {
    const [c, key] = b.dataset.reveal.split('|');
    const r = await api(`/api/reveal?app=${app}&env=${env}&comp=${c}&key=${key}`);
    box.querySelector(`[data-val="${c}|${key}"]`).textContent = r.value ?? '';
    b.remove();
  });
}

function closeDrawer() {
  current = null;
  $('#drawer').classList.remove('open');
  $('#overlay').classList.remove('on');
}

async function run(btn, path, body) {
  btn.disabled = true;
  const out = $('#out');
  if (out) out.innerHTML = '<span class="muted">Working… (a redeploy can take a minute)</span>';
  try {
    const j = await api(path, body);
    lastOut = { key: current ? current.app + '/' + current.env : '', html: `<pre>${esc(j.output || 'done')}</pre>` };
    if (out) out.innerHTML = lastOut.html;
    toast(j.ok === false ? 'Failed — see output' : 'Done ✓');
    await load();
  } catch (e) { if (out) out.innerHTML = `<pre>${esc(e.message)}</pre>`; toast(e.message); }
  finally { btn.disabled = false; }
}
async function act(btn, app, env, action) {
  let confirm;
  if (action === 'destroy') {
    confirm = prompt(`This deletes ${app}/${env}, its containers and its own database.\nType ${app}/${env} to confirm:`);
    if (confirm !== `${app}/${env}`) return toast('Not confirmed');
  } else if (env === 'prod' && !window.confirm(`${action} PROD for ${app}?`)) return;
  run(btn, '/api/action', { app, env, action, confirm });
}
</script>

<script>
// ── Variables tab ─────────────────────────────────────────────────────────────
function renderVars() {
  const apps = Object.keys(byApp()).filter(app => STATE.access?.platform_admin
    || STATE.access?.project_roles?.[app] === 'maintainer').sort();
  const el = $('#tab-vars');
  if (!el.dataset.ready) {
    el.innerHTML = `<div class="card">
      <div class="card-header"><h2>Variables &amp; Secrets</h2></div>
      <div style="padding:16px 18px">
        <div class="row">App
          <select id="varApp"></select>
          <input id="varAppNew" placeholder="or type an app name" style="width:200px">
        </div>
        <p class="muted" style="font-size:12.5px;margin-top:8px">Precedence (later wins): repo <span class="mono">.deploy/env</span> → <b>all</b> → <b>class</b> → <b>one environment</b>. Append <span class="mono">.api/.web/.app</span> to target one component.</p>
      </div>
      <div id="varBody"></div>
    </div>`;
    el.dataset.ready = 1;
    $('#varApp').onchange = () => renderVarsFor($('#varApp').value);
    $('#varAppNew').onchange = () => renderVarsFor($('#varAppNew').value.trim());
  }
  const sel = $('#varApp'), keep = sel.value;
  sel.innerHTML = apps.map(a => `<option>${esc(a)}</option>`).join('');
  if (keep && apps.includes(keep)) sel.value = keep;
  if (sel.value) renderVarsFor(sel.value);
}

async function renderVarsFor(app) {
  if (!app) return;
  const j = await api(`/api/secrets?app=${encodeURIComponent(app)}`);
  const envs = sortEnvs(STATE.deployments.filter(d => d.APP === app));
  const scopes = new Set(['common', 'preview', 'develop', 'staging', 'prod', ...envs.map(d => d.ENV_NAME), ...Object.keys(j.files)]);
  const missing = envs.filter(d => d.MISSING?.length);
  const upcoming = envs.filter(d => d.UPCOMING_MISSING?.length);
  const label = s => s === 'common' ? 'all environments' : s === 'preview' ? 'all previews' : s.includes('.') ? `${s.split('.')[0]} · ${s.split('.')[1]} only` : s;

  $('#varBody').innerHTML = `
    ${missing.length ? `<div style="padding:0 18px 12px"><div class="banner"><b>Missing required variables</b><br>${missing.map(d => `${envBadge(d.ENV_NAME)} <span class="mono">${d.MISSING.map(esc).join(', ')}</span>`).join('<br>')}</div></div>` : ''}
    ${upcoming.length ? `<div style="padding:0 18px 12px"><div class="banner"><b>Will be missing once newer code reaches them</b><br>${upcoming.map(d => `${envBadge(d.ENV_NAME)} <span class="mono">${d.UPCOMING_MISSING.map(esc).join(', ')}</span>`).join('<br>')}</div></div>` : ''}
    ${j.can_manage ? `<div style="padding:12px 18px;border-bottom:1px solid var(--line)">
      <div class="row">
        <select id="nScope">${[...scopes].map(s => `<option value="${esc(s)}">${esc(label(s))}</option>`).join('')}</select>
        <select id="nComp"><option value="">all components</option><option value=".api">api only</option><option value=".web">web only</option><option value=".app">app only</option></select>
        <input id="nKey" placeholder="KEY" class="mono" style="width:180px">
        <input id="nVal" placeholder="value" class="mono" style="flex:1;min-width:180px">
        <button class="btn primary" id="nSave">Save</button>
      </div>
      <div class="row" style="margin-top:4px">Redeploy affected: <span id="affected"></span></div>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:12.5px">📋 Bulk import — paste a .env block</summary>
        <div style="margin-top:8px">
          <textarea id="bulkEnv" rows="8" placeholder="KEY=value&#10;ANOTHER_KEY=another value&#10;# comments are ignored" style="width:100%;font:12.5px/1.5 var(--mono);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);resize:vertical"></textarea>
          <div class="row" style="margin-top:6px">
            <label for="bulkScope" class="muted">Apply to</label>
            <select id="bulkScope">${[...scopes].map(s => `<option value="${esc(s)}">${esc(label(s))}</option>`).join('')}</select>
            <button class="btn primary" id="bulkSave">Import all</button>
          </div>
          <div id="bulkOut"></div>
        </div>
      </details>
    </div>` : '<p class="muted" style="padding:12px 18px">Read-only access. Ask a project maintainer to change runtime variables.</p>'}
    ${!Object.keys(j.files).length ? '<div class="empty">No server-side variables for this app yet.</div>' : ''}
    ${Object.entries(j.files).map(([scope, kv]) => `
      <div style="padding:12px 18px;border-bottom:1px solid var(--line)">
        <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px">${esc(label(scope))} <span class="mono" style="text-transform:none">(${esc(scope)}.env)</span></div>
        <table class="kv">${kv.map(x => `<tr><td>${esc(x.key)}</td><td class="mono">${esc(x.value)}</td>
          ${j.can_manage ? `<td style="text-align:right;white-space:nowrap">
            <button class="btn" data-edit="${esc(scope)}|${esc(x.key)}" style="font-size:12px">Edit</button>
            <button class="btn danger" data-del="${esc(scope)}|${esc(x.key)}" style="font-size:12px;margin-left:4px">Delete</button>
          </td>` : ''}</tr>`).join('') || '<tr><td class="muted">empty</td></tr>'}</table>
      </div>`).join('')}`;
  if (!j.can_manage) return;

  const affectedFor = scope => {
    const base = scope.split('.')[0];
    return envs.filter(d => base === 'common' || d.ENV_NAME === base || envClass(d.ENV_NAME) === base);
  };
  const showAffected = () => {
    const sc = $('#nScope').value, list = affectedFor(sc);
    $('#affected').innerHTML = list.length
      ? list.map(d => `<button class="btn" data-redeploy="${esc(d.ENV_NAME)}" style="font-size:12px">${esc(d.ENV_NAME)}</button>`).join(' ')
      : '<span>none deployed yet</span>';
    $('#affected').querySelectorAll('[data-redeploy]').forEach(b => b.onclick = async () => {
      b.disabled = true; toast(`Redeploying ${app}/${b.dataset.redeploy}…`, 60000);
      try { const r = await api('/api/action', { app, env: b.dataset.redeploy, action: 'redeploy' }); toast(r.ok ? `${b.dataset.redeploy} redeployed ✓` : `${b.dataset.redeploy} failed`); await load(); }
      catch (e) { toast(e.message); } finally { b.disabled = false; }
    });
  };
  $('#nScope').onchange = showAffected; showAffected();
  $('#nSave').onclick = async () => {
    const scope = $('#nScope').value + $('#nComp').value, key = $('#nKey').value.trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return toast('Key must look like MY_KEY');
    try { await api('/api/secret', { app, scope, key, value: $('#nVal').value }); toast(`${key} saved — redeploy to apply`); $('#nKey').value = $('#nVal').value = ''; renderVarsFor(app); }
    catch (e) { toast(e.message); }
  };
  $('#bulkSave', el)?.addEventListener('click', async () => {
    const raw = $('#bulkEnv', el).value, scope = $('#bulkScope', el).value;
    const pairs = raw.split('\n').flatMap(line => {
      line = line.trim();
      if (!line || line.startsWith('#')) return [];
      const eq = line.indexOf('=');
      if (eq < 1) return [];
      let key = line.slice(0, eq).trim().replace(/^export\s+/, '');
      let val = line.slice(eq + 1).trim().replace(/^['"]|['"]$/g, '');
      return /^[A-Za-z_][A-Za-z0-9_]*$/.test(key) ? [{ key, value: val }] : [];
    });
    if (!pairs.length) return toast('No valid KEY=value lines found');
    try {
      const r = await api('/api/secrets/bulk', { app, scope, pairs });
      $('#bulkOut', el).innerHTML = `<pre>Saved: ${esc(r.saved.join(', ') || 'none')}</pre>`;
      toast(`${r.saved.length} variable(s) saved — redeploy to apply`);
      $('#bulkEnv', el).value = '';
      renderVarsFor(app);
    } catch (e) { toast(e.message); }
  });
  $('#varBody').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const [scope, key] = b.dataset.del.split('|');
    if (!window.confirm(`Delete ${key} from ${scope}?`)) return;
    await api('/api/secret', { app, scope, key, value: null }); toast(`${key} deleted`); renderVarsFor(app);
  });
  $('#varBody').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const [scope, key] = b.dataset.edit.split('|'), [base, comp] = scope.split('.');
    $('#nScope').value = base; $('#nComp').value = comp ? '.' + comp : ''; $('#nKey').value = key;
    $('#nVal').value = ''; $('#nVal').placeholder = 'new value (current is hidden)'; $('#nVal').focus(); showAffected();
  });
}

async function renderAccess() {
  const response = await api('/api/access');
  const access = response.access, platformAdmin = access.platform_admin;
  const identityProvider = STATE.access?.auth_mode === 'keycloak' ? 'Keycloak' : 'Authentik';
  const organizations = access.organizations;
  const identities = access.identities;
  const projects = access.projects;
  const el = $('#tab-access');
  const orgOptions = '<option value="">Select organization</option>' + organizations.map(org =>
    `<option value="${esc(org.slug)}">${esc(org.name)} (${esc(org.slug)})</option>`).join('');
  const linkedProjects = new Set(projects.map(project => project.app));
  const projectOptions = '<option value="">Select project</option>' + [...new Map(projects.map(project =>
    [project.app, project])).values()].map(project =>
      `<option value="${esc(project.app)}">${esc(project.app)} · ${esc(project.organization)}</option>`).join('');
  const identityOptions = '<option value="">Select user</option>' + identities.map(identity =>
    `<option value="${esc(identity.uid)}">${esc(identity.display_name)} · ${esc(identity.email)}</option>`).join('');
  const unlinkedProjects = response.registered_projects.filter(project => !linkedProjects.has(project.app));
  el.innerHTML = `
    ${platformAdmin ? `<div class="card">
      <div class="card-header"><h2>Organizations</h2></div>
      <div style="padding:16px 18px">
        <p class="muted">Organizations are tenant boundaries. A registered project belongs to one organization; user access still requires an explicit project grant.</p>
        <div class="row"><input id="orgName" aria-label="Organization name" placeholder="Organization name" style="min-width:220px">
          <input id="orgSlug" aria-label="Organization slug" placeholder="sage-org" class="mono" style="width:180px">
          <button class="btn primary" id="orgCreate">Create organization</button></div>
        <div class="row"><select id="orgLinkOrg" aria-label="Organization">${orgOptions}</select>
          <select id="orgLinkProject" aria-label="Unassigned registered project"><option value="">Select unassigned project</option>${unlinkedProjects.map(project =>
            `<option value="${esc(project.app)}">${esc(project.app)} · ${esc(project.repo)}</option>`).join('')}</select>
          <button class="btn" id="orgLink" ${!organizations.length || !unlinkedProjects.length ? 'disabled' : ''}>Assign registered project</button></div>
        <div id="accessOut"></div>
      </div>
    </div>` : ''}
    <div class="card">
      <div class="card-header"><h2>Organization membership</h2></div>
      <div style="padding:16px 18px">
        <p class="muted">Create or invite accounts in ${identityProvider} first. The console manages organization membership and project access; users must sign in once before they appear here. Organization admins can add existing identities to their organization; only the platform admin can appoint another organization admin.</p>
        <div class="row"><select id="memberOrg" aria-label="Organization">${orgOptions}</select>
          <input id="memberEmail" type="email" aria-label="User email" placeholder="user@example.org" style="min-width:220px">
          <select id="memberRole">${platformAdmin ? '<option value="member">Member</option><option value="org_admin">Organization admin</option>' : '<option value="member">Member</option>'}<option value="none">Remove membership</option></select>
          <button class="btn primary" id="memberAdd" ${!organizations.length ? 'disabled' : ''}>Add to organization</button></div>
        <div class="scroll"><table><tr><th>Organization</th><th>User</th><th>Role</th></tr>
          ${access.members.map(member => `<tr><td>${esc(member.organization)}</td><td>${esc(member.email)}</td><td>${esc(member.role)}</td></tr>`).join('') ||
            '<tr><td colspan="3" class="empty">No members assigned.</td></tr>'}</table></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>Project access</h2></div>
      <div style="padding:16px 18px">
        <p class="muted">Project grants are explicit and do not inherit across an organization. Viewer is read-only; Operator can deploy, restart and roll back; Maintainer can also edit runtime variables. Resource limits, project registration, database wipes and secret reveal remain platform-admin-only.</p>
        <div class="row"><select id="grantProject" aria-label="Project">${projectOptions}</select><select id="grantUser" aria-label="User">${identityOptions}</select>
          <select id="grantRole"><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="maintainer">Maintainer</option><option value="none">Remove access</option></select>
          <button class="btn primary" id="grantSave" ${!projects.length || !identities.length ? 'disabled' : ''}>Save project access</button></div>
        <div class="scroll"><table><tr><th>Organization</th><th>Project</th><th>User</th><th>Role</th></tr>
          ${projects.filter(project => project.uid).map(project =>
            `<tr><td>${esc(project.organization)}</td><td>${esc(project.app)}</td><td>${esc(project.email)}</td><td>${esc(project.role)}</td></tr>`).join('') ||
            '<tr><td colspan="4" class="empty">No project grants assigned.</td></tr>'}</table></div>
      </div>
    </div>
    ${platformAdmin ? `<div class="card"><div class="card-header"><h2>Known ${identityProvider} identities</h2><span class="card-meta">users who have signed in at least once</span></div>
      <div class="scroll"><table><tr><th>Name</th><th>Email</th><th>Identity ID</th><th>Last seen</th></tr>
        ${identities.map(identity => `<tr><td>${esc(identity.display_name)}</td><td>${esc(identity.email)}</td><td class="mono">${esc(identity.uid)}</td><td>${ago(identity.last_seen)}</td></tr>`).join('') ||
          '<tr><td colspan="4" class="empty">No users have signed in yet.</td></tr>'}</table></div></div>` : ''}`;

  const postAccess = async body => {
    const output = $('#accessOut', el);
    try { await api('/api/access', body); toast('Access updated'); await renderAccess(); await load(); }
    catch (e) { if (output) output.textContent = e.message; else toast(e.message); }
  };
  $('#orgCreate', el)?.addEventListener('click', () =>
    postAccess({ op: 'organization-create', name: $('#orgName', el).value.trim(),
      slug: $('#orgSlug', el).value.trim().toLowerCase() }));
  $('#orgLink', el)?.addEventListener('click', () =>
    postAccess({ op: 'project-link', organization: $('#orgLinkOrg', el).value,
      app: $('#orgLinkProject', el).value }));
  $('#memberAdd', el)?.addEventListener('click', () =>
    postAccess({ op: 'member', organization: $('#memberOrg', el).value,
      email: $('#memberEmail', el).value.trim(), role: $('#memberRole', el).value }));
  $('#grantSave', el)?.addEventListener('click', () =>
    postAccess({ op: 'project-grant', app: $('#grantProject', el).value,
      uid: $('#grantUser', el).value, role: $('#grantRole', el).value }));
}

// ── Projects tab ──────────────────────────────────────────────────────────────
const ALL_ENVS = ['preview', 'develop', 'staging', 'prod'];
async function renderProjects(reveal) {
  const j = await api('/api/projects');
  const g = j.gitops || {};
  const el = $('#tab-projects');
  el.innerHTML = `
  ${reveal ? `<div class="card" style="border-color:var(--accent)">
    <div class="card-header"><h2>🔑 Webhook secret for ${esc(reveal.app)} — shown only now</h2></div>
    <div style="padding:16px 18px">
      <p style="margin-bottom:12px">Add these as <b>GitHub Actions secrets</b> in <span class="mono">${esc(reveal.repo || '')}</span>:</p>
      <table class="kv">
        <tr><td>INFRA_WEBHOOK_URL</td><td class="mono">${esc(j.webhook_url)}</td><td><button class="btn" data-copy="${esc(j.webhook_url)}">Copy</button></td></tr>
        <tr><td>INFRA_WEBHOOK_SECRET</td><td class="mono">${esc(reveal.secret)}</td><td><button class="btn" data-copy="${esc(reveal.secret)}">Copy</button></td></tr>
      </table>
      <p class="muted" style="font-size:12.5px;margin-top:10px">Lost it? Use <b>Rotate secret</b> below to issue a new one.</p>
      <button class="btn primary" id="doneSecret" style="margin-top:10px">I've saved it</button>
    </div></div>` : ''}

  <div class="card">
    <div class="card-header">
      <h2>GitOps Watcher</h2>
      <span class="card-meta" style="color:${g.running ? 'var(--ok)' : 'var(--muted)'}">
        ${g.running ? `● running (pid ${g.pid})` : '○ stopped'}
      </span>
    </div>
    <div style="padding:16px 18px">
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">
        Polls every registered project's GitHub repo for new commits and PRs, then builds and deploys automatically — no GitHub Actions runner needed.
        Requires <span class="mono">GH_TOKEN</span> in <span class="mono">/etc/infra/platform.secrets.env</span>.
      </p>
      <div class="row">
        ${g.running
          ? `<button class="btn danger" id="gitopsStop">Stop watcher</button>`
          : `<button class="btn primary" id="gitopsStart">▶ Start watcher</button>
             every <input id="gitopsInterval" type="number" value="30" min="10" max="300" style="width:70px"> seconds`}
        <button class="btn" id="gitopsLogs">View logs</button>
      </div>
      <div id="gitopsOut" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Add a Project</h2></div>
    <div style="padding:16px 18px">
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">Lets a repo deploy to this server through signed webhooks. The app name must equal <span class="mono">APP_NAME</span> in the repo's <span class="mono">.deploy/manifest.env</span>.</p>
      <div class="row">
        <input id="pApp" placeholder="app name, e.g. shop-api" class="mono" style="width:200px">
        <input id="pRepo" placeholder="owner/repo" class="mono" style="width:280px">
      </div>
      <div class="row" style="margin-top:4px">Allowed environments:
        ${ALL_ENVS.map(e => `<label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" class="pEnv" value="${e}" checked> ${e}</label>`).join(' ')}
        &nbsp; prod from branch <input id="pProdBranch" value="main" class="mono" style="width:90px">
      </div>
      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12.5px">Private repo or images? Tokens (optional)</summary>
        <div class="row" style="margin-top:8px">
          <input id="pGhToken" placeholder="GitHub token (private repo)" type="password" style="width:280px">
        </div>
        <div class="row">
          <input id="pRegUser" placeholder="registry user (private images)" style="width:200px">
          <input id="pRegToken" placeholder="registry read token" type="password" style="width:280px">
        </div></details>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="pAdd">Add project</button></div>
      <div id="pOut"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Registered Projects</h2><span class="card-meta">${j.projects.length} total</span></div>
    <div class="scroll"><table>
      <tr><th>Project</th><th>Repo</th><th>Allowed Envs</th><th>Running Envs</th><th>Registry</th><th>Added</th><th></th></tr>
      ${j.projects.map(p => `<tr>
        <td class="mono"><b>${esc(p.app)}</b></td>
        <td class="mono" style="color:var(--muted)">${esc(p.repo)}</td>
        <td>${p.envs.split(',').map(e => envBadge(e === 'preview' ? 'pr-…' : e).replace('pr-…', 'preview')).join(' ')}<br><span class="muted" style="font-size:12px">prod from <span class="mono">${esc(p.prod_branch)}</span></span></td>
        <td>${p.environments.length ? p.environments.map(envBadge).join(' ') : '<span class="muted">none yet</span>'}</td>
        <td style="font-size:12.5px">${p.has_registry_token ? `<span style="color:var(--ok)">✓</span> ${esc(p.registry_user)}` : '<span class="muted">public</span>'}
          ${p.has_gh_token ? '<span style="color:var(--ok);margin-left:6px">✓ gh-token</span>' : ''}</td>
        <td style="white-space:nowrap;font-size:12.5px">${ago(p.created_at)}<br><span class="muted">${esc(p.created_by)}</span></td>
        <td style="white-space:nowrap">
          <button class="btn" data-penvs="${esc(p.app)}|${esc(p.envs)}" style="font-size:12px">Envs…</button>
          <button class="btn" data-prot="${esc(p.app)}|${esc(p.repo)}" style="font-size:12px">Rotate</button>
          <button class="btn danger" data-prm="${esc(p.app)}" style="font-size:12px">Remove</button>
        </td></tr>`).join('') || '<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}
    </table></div>
  </div>`;

  el.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Copied ✓')));
  $('#doneSecret', el)?.addEventListener('click', () => renderProjects());

  const gitopsOut = $('#gitopsOut', el);
  const gitopsAction = async (op, interval) => {
    const btn = op === 'start' ? $('#gitopsStart', el) : op === 'stop' ? $('#gitopsStop', el) : $('#gitopsLogs', el);
    if (btn) btn.disabled = true;
    try {
      const r = await api('/api/gitops', { op, interval });
      gitopsOut.innerHTML = `<pre>${esc(r.output || '')}</pre>`;
      if (op !== 'logs') renderProjects();
    } catch (e) { toast(e.message); }
    finally { if (btn) btn.disabled = false; }
  };
  $('#gitopsStart', el)?.addEventListener('click', () =>
    gitopsAction('start', parseInt($('#gitopsInterval', el)?.value || 30)));
  $('#gitopsStop', el)?.addEventListener('click', () => gitopsAction('stop'));
  $('#gitopsLogs', el)?.addEventListener('click', () => gitopsAction('logs'));
  $('#pAdd', el).onclick = async e => {
    const app = $('#pApp').value.trim(), repo = $('#pRepo').value.trim();
    const envs = [...el.querySelectorAll('.pEnv:checked')].map(c => c.value).join(',');
    if (!/^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$/.test(app)) return toast('App name: lowercase letters, digits, dashes');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('Repo must look like owner/repo');
    if (!envs) return toast('Allow at least one environment');
    e.target.disabled = true;
    try {
      const r = await api('/api/project', { op: 'add', app, repo, envs, prod_branch: $('#pProdBranch').value.trim(),
        gh_token: $('#pGhToken').value.trim(),
        registry_user: $('#pRegUser').value.trim(), registry_token: $('#pRegToken').value.trim() });
      if (!r.ok || !r.secret) { $('#pOut').innerHTML = `<pre>${esc(r.output)}</pre>`; return; }
      renderProjects({ app, repo, secret: r.secret });
    } catch (err) { toast(err.message); } finally { e.target.disabled = false; }
  };
  el.querySelectorAll('[data-prot]').forEach(b => b.onclick = async () => {
    const [app, repo] = b.dataset.prot.split('|');
    if (!window.confirm(`Issue a new webhook secret for ${app}? The current one stops working immediately.`)) return;
    const r = await api('/api/project', { op: 'rotate', app });
    if (r.secret) renderProjects({ app, repo, secret: r.secret }); else toast('Failed — see Activity');
  });
  el.querySelectorAll('[data-penvs]').forEach(b => b.onclick = async () => {
    const [app, envs] = b.dataset.penvs.split('|');
    const v = prompt(`Allowed environments for ${app} (comma separated: ${ALL_ENVS.join(', ')})`, envs);
    if (v === null) return;
    const r = await api('/api/project', { op: 'set', app, envs: v.replace(/\s+/g, '') }).catch(e => ({ output: e.message }));
    toast(r.ok ? `${app} updated` : (r.output || 'Failed')); renderProjects();
  });
  el.querySelectorAll('[data-prm]').forEach(b => b.onclick = async () => {
    const app = b.dataset.prm;
    const c = prompt(`Remove ${app}? Running environments stay until you destroy them.\nType ${app} to confirm:`);
    if (c !== app) return toast('Not confirmed');
    const r = await api('/api/project', { op: 'remove', app, confirm: c });
    toast(r.ok ? `${app} removed` : 'Failed'); renderProjects();
  });
}

// ── Activity tab ──────────────────────────────────────────────────────────────
async function renderActivity() {
  const j = await api('/api/activity');
  $('#tab-activity').innerHTML = `<div class="card">
    <div class="card-header"><h2>Recent Activity</h2><span class="card-meta">console actions + deploys</span></div>
    <div style="padding:16px 18px"><pre style="max-height:600px">${esc(j.lines.join('') || 'Nothing yet.')}</pre></div>
  </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
load().catch(e => { $('#tab-envs').innerHTML = `<div class="card"><div class="empty">Could not load: ${esc(e.message)}</div></div>`; });
setInterval(() => { if (!document.hidden && !current) load().catch(() => {}); }, 15000);
</script>
</body>
